[project]
name = "hardware-agent"
version = "0.1.0"
description = "Raspberry Pi network scanning agent (skeleton only)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0",
  "pydantic>=2.6.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.coverage.run]
source = ["agent"]
