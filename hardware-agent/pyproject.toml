[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hardware-agent"
version = "1.0.7"
description = "Raspberry Pi network scanning agent (skeleton only)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.6.0",
  "psutil>=7.0.0",
  "textual>=0.80.0",
  "httpx>=0.27.0",
  "cryptography>=42.0",
  "websockets>=15.0",
  "pymodbus==3.13.1",
  "ssh-audit==3.9.0",
]

[project.scripts]
dmitri = "agent.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "pyyaml", "asyncua==2.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.coverage.run]
source = ["agent"]
