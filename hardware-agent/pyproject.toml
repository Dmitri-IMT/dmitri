[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hardware-agent"
version = "0.1.0"
description = "Raspberry Pi network scanning agent (skeleton only)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6.0",
  "psutil>=7.0.0",
  "textual>=0.80.0"
]

[project.scripts]
dmitri = "agent.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.coverage.run]
source = ["agent"]
