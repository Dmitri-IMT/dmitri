openapi: 3.1.0
info:
  title: Vulnerability Scanner Backend API
  version: 1.0.0
  summary: Contract-first OpenAPI specification for the backend consumed by the agent and frontend.
  description: |
    This specification defines the backend API before implementation.
    It is the integration contract between the embedded scanning agent, the backend,
    and the frontend application.

    Assumptions documented in this spec:
    - Base path is `/api/v1`
    - Agent ingestion uses `X-API-Key`
    - Frontend requests use either JWT Bearer tokens or a session cookie
    - Browser CORS is allowed for `http://localhost:5173` and `https://app.vscanner.example.com`
tags:
  - name: scans
    description: Scan ingestion and scan history endpoints.
  - name: devices
    description: Host inventory and device detail endpoints.
  - name: findings
    description: Finding query endpoints for the frontend.
  - name: health
    description: Liveness and readiness endpoint.
servers:
  - url: https://api.vscanner.example.com
    description: Production placeholder
  - url: http://localhost:8000
    description: Local development
x-cors:
  allowedOrigins:
    - http://localhost:5173
    - https://app.vscanner.example.com
  allowCredentials: true
  allowHeaders:
    - Authorization
    - Content-Type
    - X-API-Key
    - X-Request-Id
  allowMethods:
    - GET
    - POST
    - OPTIONS
  exposeHeaders:
    - X-Request-Id
security: []
paths:
  /api/v1/health:
    get:
      tags:
        - health
      summary: Health endpoint
      operationId: getHealth
      security: []
      responses:
        '200':
          description: API is available.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  value:
                    status: ok
                    version: 1.0.0
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - health
      summary: CORS preflight for health endpoint
      operationId: optionsHealth
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/scans:
    post:
      tags:
        - scans
      summary: Ingest a full scan payload
      description: Hardware agents submit completed scan results through this endpoint.
      operationId: ingestScan
      security:
        - AgentApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanIngestRequest'
            examples:
              fullScan:
                $ref: '#/components/examples/ScanIngestRequestExample'
      responses:
        '202':
          description: Scan accepted for validation and persistence.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanIngestAcceptedResponse'
              examples:
                accepted:
                  value:
                    message: scan received successfully
                    scan_id: b9a2de1d-6cb0-4d1c-9f19-8f313cfa9c77
                    devices_received: 2
                    status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - scans
      summary: List scans
      description: Paginated scan listing for frontend reporting views.
      operationId: listScans
      security:
        - FrontendBearerAuth: []
        - FrontendSessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/ScanStatusFilter'
        - $ref: '#/components/parameters/ScanSortBy'
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: Paginated scan list.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - scans
      summary: CORS preflight for scans collection
      operationId: optionsScans
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/scans/{scan_id}:
    get:
      tags:
        - scans
      summary: Get scan details
      description: Returns a full scan with devices, ports, services, findings, and metadata.
      operationId: getScanById
      security:
        - FrontendBearerAuth: []
        - FrontendSessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '200':
          description: Full scan detail.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - scans
      summary: CORS preflight for scan detail
      operationId: optionsScanById
      security: []
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/devices:
    get:
      tags:
        - devices
      summary: List devices
      description: Returns the host inventory known to the backend.
      operationId: listDevices
      security:
        - FrontendBearerAuth: []
        - FrontendSessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/DeviceSortBy'
        - $ref: '#/components/parameters/SortOrder'
        - name: q
          in: query
          description: Free-text search by hostname, IP, MAC, or vendor.
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Paginated device list.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - devices
      summary: CORS preflight for devices collection
      operationId: optionsDevices
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/devices/{device_id}:
    get:
      tags:
        - devices
      summary: Get device details
      description: Returns device detail, open ports, severity summary, and scan history.
      operationId: getDeviceById
      security:
        - FrontendBearerAuth: []
        - FrontendSessionAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Device detail with scan history.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - devices
      summary: CORS preflight for device detail
      operationId: optionsDeviceById
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/findings:
    get:
      tags:
        - findings
      summary: List findings
      description: Returns findings filtered by severity, scan, or device.
      operationId: listFindings
      security:
        - FrontendBearerAuth: []
        - FrontendSessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SeverityFilter'
        - $ref: '#/components/parameters/ScanIdFilter'
        - $ref: '#/components/parameters/DeviceIdFilter'
      responses:
        '200':
          description: Paginated finding list.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - findings
      summary: CORS preflight for findings collection
      operationId: optionsFindings
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

components:
  securitySchemes:
    AgentApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key used by embedded hardware agents.
    FrontendBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token used by frontend clients.
    FrontendSessionAuth:
      type: apiKey
      in: cookie
      name: session
      description: Session cookie for frontend deployments that use cookie auth.

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Page number starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Number of records returned per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SortOrder:
      name: sort_order
      in: query
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
    ScanStatusFilter:
      name: status
      in: query
      required: false
      description: Filter scans by lifecycle status.
      schema:
        $ref: '#/components/schemas/ScanStatus'
    ScanSortBy:
      name: sort_by
      in: query
      required: false
      schema:
        type: string
        enum:
          - timestamp
          - status
          - scan_mode
        default: timestamp
    DeviceSortBy:
      name: sort_by
      in: query
      required: false
      schema:
        type: string
        enum:
          - last_seen_at
          - hostname
          - vendor
          - ip
        default: last_seen_at
    SeverityFilter:
      name: severity
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Severity'
    ScanId:
      name: scan_id
      in: path
      required: true
      description: Backend identifier of the scan.
      schema:
        type: string
        format: uuid
    ScanIdFilter:
      name: scan_id
      in: query
      required: false
      description: Filter findings by scan identifier.
      schema:
        type: string
        format: uuid
    DeviceId:
      name: device_id
      in: path
      required: true
      description: Backend identifier of the device.
      schema:
        type: string
        format: uuid
    DeviceIdFilter:
      name: device_id
      in: query
      required: false
      description: Filter findings by device identifier.
      schema:
        type: string
        format: uuid

  headers:
    X-Request-Id:
      description: Correlation identifier for logs and tracing.
      schema:
        type: string
    Access-Control-Allow-Origin:
      description: Allowed browser origin.
      schema:
        type: string
        enum:
          - http://localhost:5173
          - https://app.vscanner.example.com
    Access-Control-Allow-Credentials:
      description: Indicates whether credentials are allowed in cross-origin requests.
      schema:
        type: string
        enum:
          - 'true'
    Access-Control-Allow-Headers:
      description: Allowed headers for preflight requests.
      schema:
        type: string
        example: Authorization, Content-Type, X-API-Key, X-Request-Id
    Access-Control-Allow-Methods:
      description: Allowed methods for preflight requests.
      schema:
        type: string
        example: GET, POST, OPTIONS
    Vary-Origin:
      description: Informs caches that responses vary by request origin.
      schema:
        type: string
        enum:
          - Origin

  responses:
    CorsPreflightNoContent:
      description: Successful CORS preflight response.
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/Access-Control-Allow-Credentials'
        Access-Control-Allow-Headers:
          $ref: '#/components/headers/Access-Control-Allow-Headers'
        Access-Control-Allow-Methods:
          $ref: '#/components/headers/Access-Control-Allow-Methods'
        Vary:
          $ref: '#/components/headers/Vary-Origin'
    BadRequest:
      description: Invalid query parameters or malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            badRequest:
              value:
                error:
                  code: bad_request
                  message: Invalid filter combination.
                  details:
                    field: status
    Unauthorized:
      description: Missing or invalid authentication credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                error:
                  code: unauthorized
                  message: Authentication required.
                  details: {}
    Forbidden:
      description: Authenticated caller lacks permission to access the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                error:
                  code: forbidden
                  message: Access denied for this resource.
                  details: {}
    NotFound:
      description: Resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                error:
                  code: not_found
                  message: Requested resource was not found.
                  details: {}
    PayloadTooLarge:
      description: Payload exceeds allowed ingestion limits.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            payloadTooLarge:
              value:
                error:
                  code: payload_too_large
                  message: Scan payload exceeds the maximum accepted size.
                  details: {}
    ValidationError:
      description: Request body failed schema validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validationError:
              value:
                error:
                  code: validation_error
                  message: Request body validation failed.
                  details:
                    field: devices[0].ip
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            serverError:
              value:
                error:
                  code: internal_server_error
                  message: Unexpected server error.
                  details: {}

  examples:
    ScanIngestRequestExample:
      value:
        scan_id: b9a2de1d-6cb0-4d1c-9f19-8f313cfa9c77
        timestamp: '2026-03-05T14:12:45Z'
        subnet: 192.168.1.0/24
        scan_mode: full
        metadata:
          agent_version: 0.2.0
          nmap_arguments: -sS -sV -O --top-ports 200
          elapsed_seconds: 187
        devices:
          - ip: 192.168.1.10
            mac: B8:27:EB:44:55:66
            hostname: lab-camera
            vendor: Raspberry Pi Trading Ltd
            ports:
              - port: 22
                protocol: tcp
                state: open
                service: ssh
                version: OpenSSH 7.2p2
              - port: 80
                protocol: tcp
                state: open
                service: http
                version: lighttpd 1.4.59
          - ip: 192.168.1.40
            mac: 00:1C:B3:AA:BB:CC
            hostname: office-nas
            vendor: Synology
            ports:
              - port: 445
                protocol: tcp
                state: open
                service: smb
                version: Samba smbd 4.13.14
              - port: 548
                protocol: tcp
                state: filtered
                service: afp
                version: null
        findings:
          - severity: high
            title: Outdated SSH service exposed
            description: The camera at 192.168.1.10 runs OpenSSH 7.2p2, which lacks multiple security fixes.
            recommendation: Upgrade the firmware or disable remote SSH access from untrusted networks.
            evidence: 'Banner from 192.168.1.10: OpenSSH_7.2p2 Raspbian-5.'
          - severity: medium
            title: SMB signing disabled
            description: The NAS at 192.168.1.40 allows SMB connections without message signing, enabling MITM tampering.
            recommendation: Enable SMB signing and restrict SMB exposure.
            evidence: 'Nmap smb2-security-mode: Message signing disabled but supported.'

  schemas:
    ScanStatus:
      type: string
      enum:
        - accepted
        - processing
        - completed
        - failed
    ScanMode:
      type: string
      enum:
        - quick
        - full
    Severity:
      type: string
      enum:
        - low
        - medium
        - high
        - critical
    Port:
      type: object
      additionalProperties: false
      required:
        - port
        - protocol
        - state
        - service
      properties:
        port:
          type: integer
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum:
            - tcp
            - udp
        state:
          type: string
          enum:
            - open
            - closed
            - filtered
        service:
          type: string
          minLength: 1
        version:
          type:
            - string
            - 'null'
    DevicePayload:
      type: object
      additionalProperties: false
      required:
        - ip
        - mac
        - hostname
        - vendor
        - ports
      properties:
        ip:
          type: string
          format: ipv4
        mac:
          type: string
          pattern: '^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$'
        hostname:
          type: string
          minLength: 1
        vendor:
          type: string
          minLength: 1
        ports:
          type: array
          items:
            $ref: '#/components/schemas/Port'
          default: []
    FindingPayload:
      type: object
      additionalProperties: false
      required:
        - severity
        - title
        - description
        - recommendation
        - evidence
      properties:
        severity:
          $ref: '#/components/schemas/Severity'
        title:
          type: string
          minLength: 3
        description:
          type: string
          minLength: 3
        recommendation:
          type: string
          minLength: 3
        evidence:
          type: string
          minLength: 3
    ScanIngestRequest:
      type: object
      additionalProperties: false
      required:
        - scan_id
        - timestamp
        - subnet
        - scan_mode
        - devices
        - findings
      properties:
        scan_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        subnet:
          type: string
          pattern: '^([0-9]{1,3}[.]){3}[0-9]{1,3}/[0-9]{1,2}$'
        scan_mode:
          $ref: '#/components/schemas/ScanMode'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DevicePayload'
          default: []
        findings:
          type: array
          items:
            $ref: '#/components/schemas/FindingPayload'
          default: []
        metadata:
          type:
            - object
            - 'null'
          additionalProperties:
            oneOf:
              - type: string
              - type: integer
              - type: number
              - type: boolean
    ScanIngestAcceptedResponse:
      type: object
      additionalProperties: false
      required:
        - message
        - scan_id
        - devices_received
        - status
      properties:
        message:
          type: string
          example: scan received successfully
        scan_id:
          type: string
          format: uuid
        devices_received:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
            - accepted
    ScanSummary:
      type: object
      additionalProperties: false
      required:
        - scan_id
        - timestamp
        - subnet
        - scan_mode
        - status
        - device_count
        - finding_count
      properties:
        scan_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        subnet:
          type: string
        scan_mode:
          $ref: '#/components/schemas/ScanMode'
        status:
          $ref: '#/components/schemas/ScanStatus'
        device_count:
          type: integer
          minimum: 0
        finding_count:
          type: integer
          minimum: 0
        highest_severity:
          anyOf:
            - $ref: '#/components/schemas/Severity'
            - type: 'null'
    ScanDetailResponse:
      type: object
      additionalProperties: false
      required:
        - scan_id
        - timestamp
        - subnet
        - scan_mode
        - devices
        - findings
        - status
        - device_count
        - finding_count
      properties:
        scan_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        subnet:
          type: string
          pattern: '^([0-9]{1,3}[.]){3}[0-9]{1,3}/[0-9]{1,2}$'
        scan_mode:
          $ref: '#/components/schemas/ScanMode'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DevicePayload'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/FindingRecord'
        metadata:
          type:
            - object
            - 'null'
          additionalProperties:
            oneOf:
              - type: string
              - type: integer
              - type: number
              - type: boolean
        status:
          $ref: '#/components/schemas/ScanStatus'
        device_count:
          type: integer
          minimum: 0
        finding_count:
          type: integer
          minimum: 0
    ScanListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - total
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ScanSummary'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
    DeviceSummary:
      type: object
      additionalProperties: false
      required:
        - device_id
        - ip
        - mac
        - hostname
        - vendor
        - last_seen_at
        - open_ports_count
      properties:
