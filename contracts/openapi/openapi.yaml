openapi: 3.1.0
info:
  title: Vulnerability Scanner Backend API
  version: 1.0.0
  summary: Contract-first OpenAPI specification for the backend consumed by the 
    agent and frontend.
  description: |
    This specification defines the backend API before implementation.
    It is the integration contract between the embedded scanning agent, the backend,
    and the frontend application.

    Security v1 documented in this spec:
    - Base path is `/api/v1`
    - Agent ingestion uses Ed25519-signed requests (ADR-005, amended 2026-07-24), not a simple API key or HMAC
    - Required signature headers are `X-Device-Id`, `X-Timestamp`, `X-Nonce`, `X-Body-SHA256`, and `X-Signature`
    - Frontend business endpoints use JWT Bearer tokens
    - Refresh cookies on `/api/v1/auth/*` only; business endpoints use Bearer JWT
    - Pi command channel: outbound WSS `/api/v1/agents/{agent_id}/commands` (see ADR-011)
    - Production uses HTTPS; local development may use HTTP
    - Browser CORS is restricted to `http://localhost:5173` and `https://app.vscanner.example.com`
tags:
  - name: scans
    description: Scan ingestion and scan history endpoints.
  - name: hosts
    description: Discovered machine inventory (network hosts found by scans).
  - name: agents
    description: Scanner Pi appliances (command channel, online state).
  - name: commands
    description: Scan-now command lifecycle.
  - name: auth
    description: Login, refresh, logout, password, and invite acceptance.
  - name: users
    description: User profiles and organisation member administration.
  - name: findings
    description: Finding query endpoints for the frontend.
  - name: home
    description: Home snapshot - attention, derived events, and the activity log.
  - name: health
    description: Liveness and readiness endpoint.
servers:
  - url: https://api.vscanner.example.com
    description: Production - HTTPS required
  - url: http://localhost:8000
    description: Local development only - HTTP allowed
x-cors:
  allowedOrigins:
    - http://localhost:5173
    - https://app.vscanner.example.com
  allowCredentials: true
  allowHeaders:
    - Authorization
    - Content-Type
    - X-Request-Id
  allowMethods:
    - GET
    - POST
    - OPTIONS
  exposeHeaders:
    - X-Request-Id
security: []
paths:
  /api/v1/health:
    get:
      tags:
        - health
      summary: Health endpoint
      operationId: getHealth
      security: []
      responses:
        '200':
          description: API is available.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  value:
                    status: ok
                    version: 0.1.0
        '503':
          $ref: '#/components/responses/DatabaseUnavailableError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - health
      summary: CORS preflight for health endpoint
      operationId: optionsHealth
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/scans:
    post:
      tags:
        - scans
      summary: Ingest a full scan payload
      description: Hardware agents submit completed scan results through this
        endpoint. Security v1 requires Ed25519-signed requests with the headers
        `X-Device-Id`, `X-Timestamp`, `X-Nonce`, `X-Body-SHA256`, and
        `X-Signature`. The server verifies the signature with the device's stored
        public key, rejects replay attempts, and returns 401 for invalid or
        expired signatures and 403 for revoked devices.
      operationId: ingestScan
      security:
        - AgentSignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanIngestRequest'
            examples:
              fullScan:
                $ref: '#/components/examples/ScanIngestRequestExample'
      responses:
        '202':
          description: Scan accepted for validation and persistence.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanIngestAcceptedResponse'
              examples:
                accepted:
                  value:
                    message: scan received successfully
                    scan_id: b9a2de1d-6cb0-4d1c-9f19-8f313cfa9c77
                    hosts_received: 2
                    status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Missing signature, invalid signature, or 
            replay/clock-window failure.
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Device exists but is revoked or not allowed to submit 
            scans.
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/NonceHeader'
        - $ref: '#/components/parameters/BodySha256Header'
        - $ref: '#/components/parameters/SignatureHeader'
    get:
      tags:
        - scans
      summary: List scans
      description: 'Paginated scan listing for frontend reporting views. Authenticated
        frontend requests use `Authorization: Bearer <token>` in v1.'
      operationId: listScans
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/ScanStatusFilter'
        - $ref: '#/components/parameters/ScanAgentIdFilter'
        - $ref: '#/components/parameters/ScanSortBy'
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: Paginated scan list.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - scans
      summary: CORS preflight for scans collection
      operationId: optionsScans
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/scans/{scan_id}:
    get:
      tags:
        - scans
      summary: Get scan details
      description: |
        Returns scan detail including hosts and findings. Before ingest completes, returns **200 stub**
        with `status: pending` and empty `hosts` / `findings` arrays (scan row created at command enqueue).
        Authenticated frontend requests use `Authorization: Bearer <token>`.
      operationId: getScanById
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '200':
          description: Full scan detail.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanDetailResponse'
              examples:
                pendingStub:
                  summary: Stub before ingest
                  value:
                    scan_id: b9a2de1d-6cb0-4d1c-9f19-8f313cfa9c77
                    timestamp: '2026-06-27T12:00:00Z'
                    subnet: 10.0.0.0/24
                    scan_mode: nspi
                    status: pending
                    command_id: c1a2b3c4-d5e6-7890-abcd-ef1234567890
                    hosts: []
                    findings: []
                    host_count: 0
                    finding_count: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - scans
      summary: CORS preflight for scan detail
      operationId: optionsScanById
      security: []
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/scans/{scan_id}/risk-summary:
    get:
      tags:
        - scans
      summary: Get a bounded risk summary for a scan
      description: |
        Returns aggregate risk metrics and at most ten top-ranked findings with
        their evidence. This read-only response is suitable for dashboards and
        for a future evidence-grounded LLM tool.
      operationId: getScanRiskSummary
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '200':
          description: Risk summary scoped to the caller's organisation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanRiskSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - scans
      summary: CORS preflight for scan risk summary
      operationId: optionsScanRiskSummary
      security: []
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/scans/{scan_id}/analysis:
    get:
      tags:
        - scans
      summary: Get the persisted AI interpretation of a scan
      description: |
        Returns the current analysis state or its completed structured payload.
        This read-only endpoint never invokes an AI provider. Unknown scans and
        scans owned by another organisation are both returned as not found. AI
        disabled or missing provider credentials is reported as unavailable.
      operationId: getScanAIAnalysis
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '200':
          description: AI analysis state scoped to the caller's organisation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanAIAnalysisResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - scans
      summary: Request an AI interpretation of a completed scan
      description: |
        Creates one analysis job for a completed scan. A failed job may be
        requested again. AI disabled or missing provider credentials, and scans
        that are not completed, are reported as unavailable without creating a
        job. Pending, processing, and completed analyses conflict with a repeat
        request.
      operationId: requestScanAIAnalysis
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '202':
          description: AI analysis request state scoped to the caller's organisation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanAIAnalysisResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: An analysis has already been requested for this scan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - scans
      summary: CORS preflight for scan AI analysis
      operationId: optionsScanAIAnalysis
      security: []
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/hosts:
    get:
      tags:
        - hosts
      summary: List hosts
      description: >-
        Returns discovered machines from scans. The default page returns active
        machines; `group=quiet` pages the machines not seen recently. `quiet_total`
        counts the quiet machines across the whole inventory, not just this page.
        JWT Bearer required.
      operationId: listHosts
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/HostSortBy'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/HostGroup'
        - name: q
          in: query
          description: Free-text search by hostname, IP, MAC, or vendor.
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Paginated host list.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - hosts
      summary: CORS preflight for hosts collection
      operationId: optionsHosts
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/hosts/{host_id}:
    get:
      tags:
        - hosts
      summary: Get host details
      description: Returns host detail, ports, severity summary, and scan history. JWT Bearer required.
      operationId: getHostById
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/HostId'
      responses:
        '200':
          description: Host detail with scan history.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - hosts
      summary: CORS preflight for host detail
      operationId: optionsHostById
      security: []
      parameters:
        - $ref: '#/components/parameters/HostId'
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/findings:
    get:
      tags:
        - findings
      summary: List findings
      description: 'Returns findings filtered by severity, scan, or host. Authenticated
        frontend requests use `Authorization: Bearer <token>` in v1.'
      operationId: listFindings
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SeverityFilter'
        - $ref: '#/components/parameters/ScanIdFilter'
        - $ref: '#/components/parameters/HostIdFilter'
      responses:
        '200':
          description: Paginated finding list.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - findings
      summary: CORS preflight for findings collection
      operationId: optionsFindings
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/findings/{finding_id}:
    get:
      tags:
        - findings
      summary: Get a finding with evidence and risk context
      description: |
        Returns one finding scoped to the caller's organisation. The response
        includes persisted evidence, remediation guidance, references and the
        latest risk snapshot, making it suitable for a future read-only LLM tool.
      operationId: getFindingById
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FindingId'
      responses:
        '200':
          description: Finding detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - findings
      summary: CORS preflight for finding detail
      operationId: optionsFindingById
      security: []
      parameters:
        - $ref: '#/components/parameters/FindingId'
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/home:
    get:
      tags:
        - home
      summary: Read the Home snapshot
      description: Attention page, derived events, and the organisation activity log
        in one read. Page sizes are server constants and cannot be overridden.
      operationId: readHome
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/HomeAttentionPageFilter'
        - $ref: '#/components/parameters/HomeEventsPageFilter'
        - $ref: '#/components/parameters/HomeActivityPageFilter'
      responses:
        '200':
          description: Home snapshot for the caller's org.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - home
      summary: CORS preflight for the Home snapshot
      operationId: optionsHome
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/agents:
    get:
      tags:
        - agents
      summary: List scanner agents
      description: The org's scanner agents, with online state from the WS registry.
      operationId: listAgents
      security:
        - FrontendBearerAuth: []
      responses:
        '200':
          description: Scanner agents for the caller's org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - agents
      summary: CORS preflight for the agents collection
      operationId: optionsAgents
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/agents/{agent_id}/commands:
    get:
      tags:
        - agents
      summary: WebSocket command channel (upgrade)
      description: |
        Pi daemon opens an **outbound WebSocket** on this URL (`wss://` in production).
        The Ed25519 device signature on the HTTP upgrade request uses the same rules as ADR-005 (GET canonical string).
        `{agent_id}` MUST equal `X-Device-Id`; a mismatch is rejected.

        **OpenAPI cannot describe WebSocket frames**, so the envelope is defined as schemas and
        listed here. Every frame is JSON with a required `type` field (ADR-011 §3):

        | Frame | Direction | Schema |
        |-------|-----------|--------|
        | `hello` | Pi → backend, on connect | `AgentHelloFrame` |
        | `command` | backend → Pi | `AgentCommandFrame` |
        | `status` | Pi → backend | `AgentStatusFrame` |
        | `error` | backend → Pi | `AgentErrorFrame` |

        Scan results are **never** sent on this socket — they go to `POST /api/v1/scans`.

        Frames must be **text**, not binary; a binary frame ends the connection.

        **Close codes — the Pi keys its reconnect behaviour on these:**

        | Code | Meaning | Client action |
        |------|---------|---------------|
        | `1012` | Backend restarting (deploy). | Redial promptly with backoff. |
        | `1000` | Normal closure. | Redial with backoff. |
        | `4000` `replaced` | Another connection for this `agent_id` took the slot; at most one live socket per agent. | **Stay down.** Redialling makes the two connections evict each other. |
        | `4001` `revoked` | The device is revoked; the backend will not accept it again. | **Stay down.** |

        A `403` on the upgrade means the device is revoked **or** `{agent_id}` is not a well-formed
        UUID; both are permanent without human intervention. A `401` is retryable only after fixing
        the signature envelope (clock skew, fresh nonce).
      operationId: connectAgentCommandsWebSocket
      security:
        - AgentSignatureAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/NonceHeader'
        - $ref: '#/components/parameters/BodySha256Header'
        - $ref: '#/components/parameters/SignatureHeader'
      responses:
        '101':
          description: Switching Protocols — WebSocket established.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - agents
      summary: Trigger scan now
      description: Enqueues a command and stub scan; delivers on open WebSocket when Pi is online.
      operationId: createAgentCommand
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommandRequest'
      responses:
        '201':
          description: Command created and delivery attempted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DeviceBusyError'
        '422':
          $ref: '#/components/responses/ScanSubnetNotReported'
        '503':
          $ref: '#/components/responses/DeviceOfflineError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - agents
      summary: CORS preflight for the scan-now trigger
      operationId: optionsAgentCommands
      security: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/agents/{agent_id}:
    get:
      tags:
        - agents
      summary: Get scanner agent
      description: |
        Agent detail including online state (from WS registry) and active command. The detail also
        carries the networks the connected Pi reported and the network an admin chose.
      operationId: getAgentById
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: Agent detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - agents
      summary: Set the agent's target network
      description: Chooses, from the networks the connected Pi reported, the one its scans use.
      operationId: updateAgentTargetSubnet
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentTargetSubnetRequest'
      responses:
        '200':
          description: Agent detail after the choice was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AgentOfflineConflict'
        '422':
          $ref: '#/components/responses/TargetSubnetNotReported'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - agents
      summary: CORS preflight for agent detail
      operationId: optionsAgentById
      security: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/commands/{command_id}:
    get:
      tags:
        - commands
      summary: Get command lifecycle
      operationId: getCommandById
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CommandId'
      responses:
        '200':
          description: Command lifecycle; scan_id when delivery created a linked scan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - commands
      summary: CORS preflight for command detail
      operationId: optionsCommandById
      security: []
      parameters:
        - $ref: '#/components/parameters/CommandId'
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/auth/login:
    post:
      tags:
        - auth
      summary: Login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access JWT in body; refresh token in httpOnly Set-Cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Refresh'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    options:
      tags:
        - auth
      summary: CORS preflight for login
      operationId: optionsLogin
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/auth/refresh:
    post:
      tags:
        - auth
      summary: Refresh access token
      description: 'Takes the httpOnly refresh cookie (no body, no Bearer) and returns a new access
        JWT, rotating the cookie. The SPA calls this with `credentials: include`.'
      operationId: refreshSession
      security:
        - RefreshCookieAuth: []
      responses:
        '200':
          description: New access JWT; refresh cookie rotated.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Refresh'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Cookie missing, expired, revoked, or reused after rotation (the token
            family is invalidated). The SPA redirects to login.
    options:
      tags:
        - auth
      summary: CORS preflight for refresh
      operationId: optionsRefresh
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/auth/logout:
    post:
      tags:
        - auth
      summary: Logout
      description: Revokes the refresh token server-side and clears the cookie. Server revocation
        is the point — a client-only logout is not sufficient (AUTH Phase 1).
      operationId: logout
      security:
        - RefreshCookieAuth: []
      responses:
        '204':
          description: Logged out; refresh revoked server-side.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Cleared'
        '401':
          $ref: '#/components/responses/Unauthorized'
    options:
      tags:
        - auth
      summary: CORS preflight for logout
      operationId: optionsLogout
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/auth/change-password:
    post:
      tags:
        - auth
      summary: Change password
      operationId: changePassword
      security:
        - FrontendBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password updated.
        '400':
          $ref: '#/components/responses/PasswordChangeRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: The `Authorization` header is missing, malformed, or its access token has
            expired — a session failure only. A wrong `current_password` is **never** `401`; it is
            the `400` above (contract ask C13).
    options:
      tags:
        - auth
      summary: CORS preflight for change-password
      operationId: optionsChangePassword
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/auth/forgot-password:
    post:
      tags:
        - auth
      summary: Request password reset email
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: If account exists, reset email sent. Always `204` — never reveal whether
            the address has an account.
    options:
      tags:
        - auth
      summary: CORS preflight for forgot-password
      operationId: optionsForgotPassword
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/auth/reset-password:
    post:
      tags:
        - auth
      summary: Reset password with token
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password reset.
        '400':
          $ref: '#/components/responses/ResetPasswordRejected'
        '410':
          $ref: '#/components/responses/ResetTokenGone'
    options:
      tags:
        - auth
      summary: CORS preflight for reset-password
      operationId: optionsResetPassword
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/invites:
    get:
      tags:
        - auth
      summary: List pending organisation invites
      operationId: listPendingInvites
      security:
        - FrontendBearerAuth: []
      responses:
        '200':
          description: Live, unconsumed invitations for the caller's organisation, ordered by
            expiry time and then invitation identifier. Token material is never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingInviteListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - auth
      summary: Create org invite (admin)
      operationId: createInvite
      security:
        - FrontendBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Invite created; returns single-use link token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCreatedResponse'
        '400':
          $ref: '#/components/responses/InviteCreateRejected'
          description: The email is already a member of the caller's own org. An email belonging
            to a **different** org is not reported here and returns `201` — surfacing it would let
            an admin probe for accounts at other tenants. That case fails at acceptance instead.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InviteAlreadyPending'
    options:
      tags:
        - auth
      summary: CORS preflight for invite creation
      operationId: optionsInvites
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/invites/accept:
    post:
      tags:
        - auth
      summary: Accept invite and create account
      operationId: acceptInvite
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '201':
          description: Account created **and signed in** — returns a full `LoginResponse`, so the
            invitee lands on HOME rather than at a login screen (contract ask C7, resolved).
          headers:
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Refresh'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/AcceptInviteRejected'
        '410':
          $ref: '#/components/responses/AcceptInviteTokenGone'
    options:
      tags:
        - auth
      summary: CORS preflight for invite acceptance
      operationId: optionsAcceptInvite
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/invites/lookup:
    post:
      tags:
        - auth
      summary: Read an invite without consuming it
      operationId: lookupInvite
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteLookupRequest'
      responses:
        '200':
          description: The invitation is live. Returns only the invited address, the offered role
            and the organisation name — never the org id, the invite id, the token, or any
            timestamp. Reading does not consume the invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteLookupResponse'
        '410':
          $ref: '#/components/responses/AcceptInviteTokenGone'
          description: Expired, already accepted, and unknown tokens are reported identically —
            same status, same code, same body — so the lookup is not an enumeration oracle. The
            component is shared with invite acceptance so the wording cannot drift.
    options:
      tags:
        - auth
      summary: CORS preflight for invite lookup
      operationId: optionsInviteLookup
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/invites/{invite_id}:
    delete:
      tags:
        - auth
      summary: Revoke a pending organisation invite
      operationId: revokeInvite
      security:
        - FrontendBearerAuth: []
      parameters:
        - name: invite_id
          in: path
          required: true
          description: Backend identifier of the pending invitation to revoke.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Invitation hard-deleted. The body is empty and its token is immediately
            unusable.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Accepted, expired, foreign-organisation, and unknown invitations are
            reported identically.

  /api/v1/users:
    get:
      tags:
        - users
      summary: List organisation members
      operationId: listOrgUsers
      security:
        - FrontendBearerAuth: []
      responses:
        '200':
          description: Members of the caller's organisation, ordered by most recent activity with
            members who have no last-seen value last. Login history and member status are omitted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMemberListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/users/me:
    get:
      tags:
        - users
      summary: Get current user profile
      operationId: getCurrentUser
      security:
        - FrontendBearerAuth: []
      responses:
        '200':
          description: Caller profile.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
        - users
      summary: Remove own account
      operationId: deleteCurrentUser
      security:
        - FrontendBearerAuth: []
      responses:
        '204':
          description: Account removed. The body is empty and the caller's sessions and reset
            tokens are gone with the row — the SPA should drop its token and return to login.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/LastAdminConflict'

  /api/v1/users/{user_id}:
    patch:
      tags:
        - users
      summary: Change an organisation member's role
      operationId: updateUserRole
      security:
        - FrontendBearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          description: Backend identifier of the member whose role will change.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: Role changed; returns the updated member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Unknown and foreign-organisation members are reported identically.
        '409':
          $ref: '#/components/responses/RoleChangeConflict'
    delete:
      tags:
        - users
      summary: Remove another account in the caller's organisation
      operationId: deleteUser
      security:
        - FrontendBearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          description: Backend identifier of the account to remove.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Account removed. The body is empty and the removed account's sessions and
            reset tokens are gone with the row.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SelfTargetConflict'

components:
  securitySchemes:
    AgentSignatureAuth:
      type: apiKey
      in: header
      name: X-Signature
      description: Ed25519 signature for device-to-API requests (ADR-005, amended
        2026-07-24). The backend verifies the signature with the device's stored
        public key — it holds no shared secret. This scheme must be used together
        with the required headers `X-Device-Id`, `X-Timestamp`, `X-Nonce`, and
        `X-Body-SHA256`.
    FrontendBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token used by frontend clients. Short-lived (~15 min) and held
        in SPA memory only — never in localStorage. The token's internal claims are an
        implementation detail of the session machinery and are not part of this contract — do
        not decode it client-side. Call `GET /api/v1/users/me` for the caller's identity and
        role.
    RefreshCookieAuth:
      type: apiKey
      in: cookie
      name: dmitri_refresh
      description: |
        httpOnly refresh cookie. Scoped to `/api/v1/auth` — it is **never** sent to business
        endpoints, which take the Bearer JWT instead (AUTH Phase 1 / ADR-005). Rotated on every
        refresh; reuse of a retired token invalidates the whole family. Fixed 7-day lifetime from
        login, with no sliding extension: after 7 days the user logs in with a password again.
        The SPA sends it by setting `credentials: include` on `/auth/*` calls only.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Page number starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Number of records returned per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    HomeAttentionPageFilter:
      name: attention_page
      in: query
      required: false
      description: Attention page number starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    HomeEventsPageFilter:
      name: events_page
      in: query
      required: false
      description: Events page number starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    HomeActivityPageFilter:
      name: activity_page
      in: query
      required: false
      description: Activity page number starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    SortOrder:
      name: sort_order
      in: query
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
    ScanStatusFilter:
      name: status
      in: query
      required: false
      description: Filter scans by lifecycle status.
      schema:
        $ref: '#/components/schemas/ScanStatus'
    ScanAgentIdFilter:
      name: agent_id
      in: query
      required: false
      description: Limit scans to those produced by this box.
      schema:
        type: string
        format: uuid
    ScanSortBy:
      name: sort_by
      in: query
      required: false
      schema:
        type: string
        enum:
          - timestamp
          - status
          - scan_mode
        default: timestamp
    HostSortBy:
      name: sort_by
      in: query
      required: false
      schema:
        type: string
        enum:
          - last_seen_at
          - hostname
          - vendor
          - ip
          - vulnerability_count
        default: last_seen_at
    HostGroup:
      name: group
      in: query
      required: false
      schema:
        type: string
        enum:
          - active
          - quiet
        default: active
    SeverityFilter:
      name: severity
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Severity'
    ScanId:
      name: scan_id
      in: path
      required: true
      description: Backend identifier of the scan.
      schema:
        type: string
        format: uuid
    FindingId:
      name: finding_id
      in: path
      required: true
      description: Public identifier of a persisted finding.
      schema:
        type: string
        format: uuid
    ScanIdFilter:
      name: scan_id
      in: query
      required: false
      description: Filter findings by scan identifier.
      schema:
        type: string
        format: uuid
    HostId:
      name: host_id
      in: path
      required: true
      description: Backend identifier of a discovered host.
      schema:
        type: string
        format: uuid
    AgentId:
      name: agent_id
      in: path
      required: true
      description: Scanner Pi identifier. On the WebSocket upgrade this MUST equal the
        `X-Device-Id` header — a mismatch is rejected (ADR-011).
      schema:
        type: string
        format: uuid
    CommandId:
      name: command_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HostIdFilter:
      name: host_id
      in: query
      required: false
      description: Filter findings by host identifier. Same `host_id` as
        `GET /api/v1/hosts/{host_id}` — this is what lets HOST DETAIL show its findings.
      schema:
        type: string
        format: uuid

    DeviceIdHeader:
      name: X-Device-Id
      in: header
      required: true
      description: The calling agent's `agent_id`, issued by the backend at provisioning.
        (Header name is frozen by ADR-005; the value identifies an **agent**, not a host.)
      schema:
        type: string
        format: uuid
    TimestampHeader:
      name: X-Timestamp
      in: header
      required: true
      description: UTC timestamp used in signature validation, ISO 8601 format.
      schema:
        type: string
        format: date-time
    NonceHeader:
      name: X-Nonce
      in: header
      required: true
      description: Per-request unique nonce used for anti-replay protection.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    BodySha256Header:
      name: X-Body-SHA256
      in: header
      required: true
      description: Lowercase hex SHA-256 of the raw request body.
      schema:
        type: string
        pattern: ^[0-9a-f]{64}$
    SignatureHeader:
      name: X-Signature
      in: header
      required: true
      description: Lowercase hex Ed25519 signature (64-byte signature → 128 hex
        chars) over the canonical string
        `METHOD\nPATH\nX-Device-Id\nX-Timestamp\nX-Nonce\nX-Body-SHA256`.
      schema:
        type: string
        pattern: ^[0-9a-f]{128}$
  headers:
    X-Request-Id:
      description: Correlation identifier for logs and tracing.
      schema:
        type: string
    Set-Cookie-Refresh:
      description: |
        Issues (or rotates) the httpOnly refresh cookie. Production attributes:
        `HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth; Max-Age=604800` (7 days).
      schema:
        type: string
        example: dmitri_refresh=<token>; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth;
          Max-Age=604800
    Set-Cookie-Cleared:
      description: Clears the refresh cookie on logout (server-side revocation is authoritative;
        this only tidies the browser).
      schema:
        type: string
        example: dmitri_refresh=; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth; Max-Age=0
    Access-Control-Allow-Origin:
      description: Allowed browser origin.
      schema:
        type: string
        enum:
          - http://localhost:5173
          - https://app.vscanner.example.com
    Access-Control-Allow-Credentials:
      description: Indicates whether credentials are allowed in cross-origin 
        requests.
      schema:
        type: string
        enum:
          - 'true'
    Access-Control-Allow-Headers:
      description: Allowed headers for preflight requests.
      schema:
        type: string
        example: Authorization, Content-Type, X-Request-Id
    Access-Control-Allow-Methods:
      description: Allowed methods for preflight requests.
      schema:
        type: string
        example: GET, POST, PATCH, DELETE, OPTIONS
    Vary-Origin:
      description: Informs caches that responses vary by request origin.
      schema:
        type: string
        enum:
          - Origin

  responses:
    # Every browser-called route needs an `options` twin returning this response —
    # when adding an endpoint the SPA will call, add its CORS preflight operation too.
    CorsPreflightNoContent:
      description: Successful CORS preflight response.
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/Access-Control-Allow-Credentials'
        Access-Control-Allow-Headers:
          $ref: '#/components/headers/Access-Control-Allow-Headers'
        Access-Control-Allow-Methods:
          $ref: '#/components/headers/Access-Control-Allow-Methods'
        Vary:
          $ref: '#/components/headers/Vary-Origin'
    BadRequest:
      description: Invalid query parameters or malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            badRequest:
              value:
                error:
                  code: bad_request
                  message: Invalid filter combination.
                  details:
                    field: status
    Unauthorized:
      description: Missing or invalid authentication credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                error:
                  code: unauthorized
                  message: Authentication required.
                  details: {}
    Forbidden:
      description: Authenticated caller lacks permission to access the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                error:
                  code: forbidden
                  message: Access denied for this resource.
                  details: {}
    NotFound:
      description: Resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                error:
                  code: not_found
                  message: Requested resource was not found.
                  details: {}
    PayloadTooLarge:
      description: Payload exceeds allowed ingestion limits.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            payloadTooLarge:
              value:
                error:
                  code: payload_too_large
                  message: Scan payload exceeds the maximum accepted size.
                  details: {}
    ValidationError:
      description: Request body failed schema validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validationError:
              value:
                error:
                  code: validation_error
                  message: Request body validation failed.
                  details:
                    field: hosts[0].ip
    DeviceBusyError:
      description: |
        The Pi is already `running` or `uploading` a scan — one scan at a time per agent (B6).
        The `code` is pinned: clients and metrics may switch on it.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                    properties:
                      code:
                        const: device_busy
          examples:
            deviceBusy:
              value:
                error:
                  code: device_busy
                  message: That Pi is already scanning.
                  details: {}
    DeviceOfflineError:
      description: |
        The command never reached the Pi — there was no open socket, or the single send attempt
        threw. Delivery is not retried; triggering the scan again is the retry. The command is
        recorded as `expired` (never `failed`: the Pi never took the job). The `code` is pinned.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                    properties:
                      code:
                        const: device_offline
          examples:
            deviceOffline:
              value:
                error:
                  code: device_offline
                  message: Pi seems to be offline.
                  details: {}
    AgentOfflineConflict:
      description: |
        The Pi is not holding a connection, so it has reported no networks and there is nothing to
        choose from; the stored choice is unchanged. Same machine code as the trigger's `503`
        because the condition is the same; the status differs because nothing was dispatched.
        The `code` is pinned.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                    properties:
                      code:
                        enum:
                          - device_offline
          examples:
            agentOffline:
              value:
                error:
                  code: device_offline
                  message: Pi seems to be offline.
                  details: {}
    TargetSubnetNotReported:
      description: |
        The value is a well-formed CIDR but is not one the connected Pi reported; the stored choice
        is unchanged. The `code` is pinned.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                    properties:
                      code:
                        enum:
                          - subnet_not_reported
          examples:
            targetSubnetNotReported:
              value:
                error:
                  code: subnet_not_reported
                  message: That network is not one the Pi reported.
                  details: {}
    ScanSubnetNotReported:
      description: |
        The network named for this scan is not one the Pi is currently reporting — the stored
        choice may predate a change of cabling or address range. No command was created and the
        stored choice is unchanged. Same machine code as `TargetSubnetNotReported` because it is
        the same rule; a separate component because the description and the operation differ.
        The `code` is pinned.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                    properties:
                      code:
                        enum:
                          - subnet_not_reported
          examples:
            scanSubnetNotReported:
              value:
                error:
                  code: subnet_not_reported
                  message: That network is not one the Pi reported.
                  details: {}
    PasswordChangeRejected:
      description: |
        Wrong `current_password`, or the new password fails the policy. **This must be `400`,
        not `401`** — a `401` trips the SPA's refresh interceptor and bounces the user to login
        over a mistyped field (contract ask C13). The `code` is pinned: the SPA switches on it
        to choose which field to flag.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                    properties:
                      code:
                        enum:
                          - wrong_current_password
                          - password_policy_violation
          examples:
            wrongCurrentPassword:
              value:
                error:
                  code: wrong_current_password
                  message: Current password is incorrect.
                  details: {}
            passwordPolicyViolation:
              value:
                error:
                  code: password_policy_violation
                  message: Password does not meet policy requirements.
                  details: {}
    ResetPasswordRejected:
      description: |
        The reset token is good but the new password fails the policy. A dead token is `410`,
        not this — the two need opposite instructions ("pick a better password" vs "request a
        new link"), which is why they no longer share a status (contract ask C15). The `code`
        is pinned.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                    properties:
                      code:
                        enum:
                          - password_policy_violation
          examples:
            passwordPolicyViolation:
              value:
                error:
                  code: password_policy_violation
                  message: Password does not meet policy requirements.
                  details: {}
    ResetTokenGone:
      description: |
        The reset link is dead — never issued, already used (single-use), or expired. All three
        emit the **same** code on purpose: telling them apart would let a token guesser confirm
        which of its guesses once existed. Checked before the password policy, so a dead token
        with a weak password answers `410`, not `400`. The `code` is pinned.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                    properties:
                      code:
                        enum:
                          - invalid_reset_token
          examples:
            invalidResetToken:
              value:
                error:
                  code: invalid_reset_token
                  message: Invalid or expired reset token.
                  details: {}
    AcceptInviteRejected:
      description: |
        The invite token is live but the request cannot be accepted: the invited address already
        has an account, or the chosen password fails the policy. A dead token is `410`, not this.
        The `code` is pinned: the SPA switches on it to choose which field to flag.
        `email_already_registered` is **global** — the address has an
        account somewhere, not necessarily in this org (contrast `email_already_member` on invite
        creation, which is org-scoped).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                    properties:
                      code:
                        enum:
                          - email_already_registered
                          - password_policy_violation
          examples:
            emailAlreadyRegistered:
              value:
                error:
                  code: email_already_registered
                  message: Email is already registered.
                  details: {}
            passwordPolicyViolation:
              value:
                error:
                  code: password_policy_violation
                  message: Password does not meet policy requirements.
                  details: {}
    AcceptInviteTokenGone:
      description: |
        The invite link is dead — never issued, already used (single-use), or expired. All three
        emit the **same** code on purpose: telling them apart would let a token guesser confirm
        which of its guesses once existed. Checked before the email match and the password policy,
        so a dead token with a weak password answers `410`, not `400`. The `code` is pinned.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                    properties:
                      code:
                        enum:
                          - invalid_invite_token
          examples:
            invalidInviteToken:
              value:
                error:
                  code: invalid_invite_token
                  message: Invalid or expired invite token.
                  details: {}
    InviteCreateRejected:
      description: |
        The email is already a member of the caller's own org. An email belonging to a
        **different** org is not reported here and returns `201` — surfacing it would let an
        admin probe for accounts at other tenants. That case fails at acceptance instead. The
        `code` is pinned.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                    properties:
                      code:
                        enum:
                          - email_already_member
          examples:
            emailAlreadyMember:
              value:
                error:
                  code: email_already_member
                  message: Email is already a member of this org.
                  details: {}
    InviteAlreadyPending:
      description: |
        The address already has a live invite — unconsumed and unexpired. The admin should wait
        for it to be accepted or expire rather than resubmit, which is why this is `409`, not
        `400` (RFC 9110's "the request could not be completed due to a conflict... the user might
        be able to resolve the conflict and resubmit"). Precedence: if the address is **also**
        already a member, `400 email_already_member` wins instead. The `code` is pinned.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                    properties:
                      code:
                        enum:
                          - invite_already_pending
          examples:
            inviteAlreadyPending:
              value:
                error:
                  code: invite_already_pending
                  message: Email already has a pending invite.
                  details: {}
    LastAdminConflict:
      description: |
        The caller is the organisation's only admin, so removing their account would leave it
        with none. The caller holds every permission this request needs — nothing is being
        denied them — it is the organisation's current state that refuses, which is why this is
        `409` and not `403` (RFC 9110 § 15.5.10: "the request could not be completed due to a
        conflict with the current state of the target resource"). The caller resolves it by
        promoting another admin and resubmitting. The `code` is pinned.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                    properties:
                      code:
                        enum:
                          - last_admin
          examples:
            lastAdmin:
              value:
                error:
                  code: last_admin
                  message: Add another admin before removing your account.
                  details: {}
    SelfTargetConflict:
      description: |
        The admin targeted their own account for removal. The caller holds every permission this
        request needs — nothing is being denied them — it is the current state of the target,
        being the caller themselves, that refuses, which is why this is `409` and not `403`
        (RFC 9110 § 15.5.10). Removing your own account is available from Settings. The `code`
        is pinned.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                    properties:
                      code:
                        enum:
                          - self_target
          examples:
            selfTarget:
              value:
                error:
                  code: self_target
                  message: Remove your account from Settings instead.
                  details: {}
    RoleChangeConflict:
      description: |
        The role change conflicts with the organisation's current state: an admin targeted their
        own account, or demoting the target would leave the organisation without an admin. The
        caller holds the required permission, so this is `409`, not `403`. The `code` is pinned.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                    properties:
                      code:
                        enum:
                          - last_admin
                          - self_target
          examples:
            lastAdmin:
              value:
                error:
                  code: last_admin
                  message: Add another admin before changing this role.
                  details: {}
            selfTarget:
              value:
                error:
                  code: self_target
                  message: You cannot change your own role.
                  details: {}
    DatabaseUnavailableError:
      description: |
        The health check's live database round-trip failed. The `code` is pinned.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                    properties:
                      code:
                        const: database_unreachable
          examples:
            databaseUnavailable:
              value:
                error:
                  code: database_unreachable
                  message: Database connection failed.
                  details: {}
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            serverError:
              value:
                error:
                  code: internal_server_error
                  message: Unexpected server error.
                  details: {}

  examples:
    ScanIngestRequestExample:
      value:
        scan_id: b9a2de1d-6cb0-4d1c-9f19-8f313cfa9c77
        timestamp: '2026-03-05T14:12:45Z'
        subnet: 192.168.1.0/24
        scan_mode: standard
        metadata:
          agent_version: 0.2.0
          nmap_arguments: -sS -sV -O --top-ports 200
          elapsed_seconds: 187
        hosts:
          - ip: 192.168.1.10
            mac: B8:27:EB:44:55:66
            hostname: lab-camera
            vendor: Raspberry Pi Trading Ltd
            ports:
              - port: 22
                protocol: tcp
                state: open
                service: ssh
                version: OpenSSH 7.2p2
              - port: 80
                protocol: tcp
                state: open
                service: http
                version: lighttpd 1.4.59
          - ip: 192.168.1.40
            mac: 00:1C:B3:AA:BB:CC
            hostname: office-nas
            vendor: Synology
            ports:
              - port: 445
                protocol: tcp
                state: open
                service: smb
                version: Samba smbd 4.13.14
              - port: 548
                protocol: tcp
                state: filtered
                service: afp
                version:
        findings:
          - ip: 192.168.1.10
            port: 22
            protocol: tcp
            service: ssh
            source: nmap_vulners
            source_script: vulners
            cve_id: CVE-2016-10012
            cvss_score: 7.8
            severity: high
            title: OpenSSH version mapped to known CVE
            description: The camera at 192.168.1.10 exposes OpenSSH 7.2p2 on 
              TCP/22 and the vulners NSE script mapped the detected version to a 
              published CVE.
            recommendation: Upgrade the firmware or disable remote SSH access 
              from untrusted networks.
            evidence: vulners matched OpenSSH 7.2p2 to CVE-2016-10012 with CVSS
              7.8 during the NSE phase.
            references:
              - https://vulners.com/cve/CVE-2016-10012
          - ip: 192.168.1.40
            port: 445
            protocol: tcp
            service: smb
            source: nmap_nse
            source_script: smb2-security-mode
            cve_id:
            cvss_score:
            severity: medium
            title: SMB signing disabled
            description: The NAS at 192.168.1.40 allows SMB connections without 
              message signing, enabling MITM tampering.
            recommendation: Enable SMB signing and restrict SMB exposure.
            evidence: 'Nmap smb2-security-mode reported: message_signing: disabled
              (dangerous, but default).'
            references: []

  schemas:
    ScanStatus:
      type: string
      enum:
        - pending
        - accepted
        - processing
        - completed
        - failed
    ScanMode:
      type: string
      enum:
        - quick
        - standard
        - extensive
        - nspi
        - max
    NspiSubmode:
      type: string
      enum:
        - inventory
        - read_only_mapping
        - active_validation
    NspiOptions:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          const: 1
          default: 1
        submode:
          $ref: '#/components/schemas/NspiSubmode'
          default: inventory
        active_risk_acknowledged:
          type: boolean
          default: false
        change_ticket:
          type: [string, 'null']
          minLength: 1
          maxLength: 120
    CommandStatus:
      type: string
      enum:
        - queued
        - delivered
        - running
        - uploading
        - done
        - failed
        - expired
    ScanErrorCode:
      type: string
      enum:
        - device_offline
        - device_busy
        - agent_disconnected
        - scan_failed
        - invalid_command
        - result_unavailable
        - ingest_failed
        - unknown
    Severity:
      type: string
      enum:
        - low
        - medium
        - high
        - critical
    MachineType:
      type: string
      enum:
        - router
        - computer
        - camera
        - storage
        - tv
        - phone
        - printer
        - sensor
        - unknown
    Port:
      type: object
      additionalProperties: false
      required:
        - port
        - protocol
        - state
        - service
      properties:
        port:
          type: integer
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum:
            - tcp
            - udp
        state:
          type: string
          enum:
            - open
            - closed
            - filtered
        service:
          type: string
          minLength: 1
        version:
          anyOf:
            - type: string
            - type: 'null'
    HostPort:
      type: object
      additionalProperties: false
      required:
        - port
        - protocol
        - service
        - first_seen_at
        - last_seen_at
      properties:
        port:
          type: integer
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum:
            - tcp
            - udp
        service:
          type: string
          minLength: 1
        version:
          anyOf:
            - type: string
            - type: 'null'
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
    PortPayload:
      type: object
      additionalProperties: false
      required:
        - port
        - protocol
        - state
        - service
      properties:
        port:
          type: integer
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum:
            - tcp
            - udp
        state:
          type: string
          enum:
            - open
            - closed
            - filtered
        service:
          type: string
          minLength: 1
        version:
          anyOf:
            - type: string
            - type: 'null'
        cpes:
          type: array
          items:
            type: string
            minLength: 1
          default: []
    OperatingSystemDetection:
      type: object
      additionalProperties: false
      required:
        - name
        - accuracy
      properties:
        name:
          type: string
          minLength: 1
        accuracy:
          type: integer
          minimum: 0
          maximum: 100
        vendor:
          type: [string, 'null']
        family:
          type: [string, 'null']
        generation:
          type: [string, 'null']
        device_type:
          type: [string, 'null']
        cpes:
          type: array
          items:
            type: string
            minLength: 1
          default: []
    ModbusDeviceIdentificationPayload:
      type: object
      additionalProperties: false
      properties:
        vendor_name:
          type: [string, 'null']
          maxLength: 128
        product_code:
          type: [string, 'null']
          maxLength: 128
        major_minor_revision:
          type: [string, 'null']
          maxLength: 128
        vendor_url:
          type: [string, 'null']
          maxLength: 128
        product_name:
          type: [string, 'null']
          maxLength: 128
        model_name:
          type: [string, 'null']
          maxLength: 128
        user_application_name:
          type: [string, 'null']
          maxLength: 128
        objects:
          type: object
          additionalProperties:
            type: string
          default: {}
        truncated:
          type: boolean
          default: false
    ModbusAddressRangePayload:
      type: object
      additionalProperties: false
      required:
        - address_space
        - start_address
        - count
        - status
        - observed_at
      properties:
        address_space:
          type: string
          enum: [coil, discrete_input, holding_register, input_register]
        start_address:
          type: integer
          minimum: 0
          maximum: 65535
        count:
          type: integer
          minimum: 1
          maximum: 65536
        status:
          type: string
          enum: [readable, illegal_address, illegal_function, timeout, error, skipped]
        exception_code:
          type: [integer, 'null']
          minimum: 1
          maximum: 255
        label:
          type: [string, 'null']
          maxLength: 128
        value_digest:
          type: [string, 'null']
          pattern: '^hmac-sha256:[0-9a-f]{64}$'
        observed_at:
          type: string
          format: date-time
    ModbusUnitPayload:
      type: object
      additionalProperties: false
      required:
        - unit_id
        - status
      properties:
        unit_id:
          type: integer
          minimum: 0
          maximum: 255
        status:
          type: string
          enum: [responding, exception, timeout, error, skipped]
        exception_code:
          type: [integer, 'null']
          minimum: 1
          maximum: 255
        error:
          type: [string, 'null']
          maxLength: 128
        device_identification:
          anyOf:
            - $ref: '#/components/schemas/ModbusDeviceIdentificationPayload'
            - type: 'null'
        identification_sources:
          type: array
          items:
            type: string
            minLength: 1
          maxItems: 8
          default: []
        address_ranges:
          type: array
          items:
            $ref: '#/components/schemas/ModbusAddressRangePayload'
          maxItems: 32
          default: []
    ModbusTcpServicePayload:
      type: object
      additionalProperties: false
      required:
        - port
        - confidence
      properties:
        protocol:
          type: string
          const: modbus_tcp
          default: modbus_tcp
        port:
          type: integer
          minimum: 1
          maximum: 65535
        confidence:
          type: string
          enum: [suspected, confirmed]
        evidence_sources:
          type: array
          items:
            type: string
