        - scan_id
        - timestamp
        - subnet
        - scan_mode
        - hosts
        - findings
        - assessment_status
        - assessment_policy_version
        - exposures
        - status
        - evidence_completeness
        - host_count
        - finding_count
      properties:
        scan_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        subnet:
          type: string
          pattern: '^([0-9]{1,3}[.]){3}[0-9]{1,3}/[0-9]{1,2}$'
        scan_mode:
          $ref: '#/components/schemas/ScanMode'
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/ScanHostView'
          description: Machines discovered by this scan. Items reuse the ingest
            `HostPayload` shape; they gain a `host_id` under contract ask C9.
        findings:
          type: array
          items:
            $ref: '#/components/schemas/FindingRecord'
        progress:
          anyOf:
            - $ref: '#/components/schemas/ScanProgressRead'
            - type: 'null'
          description: Latest progress snapshot while the scan is unfinished; final scan data is authoritative after ingest.
        assessment_status:
          $ref: '#/components/schemas/AssessmentStatus'
        assessment_policy_version:
          type: [string, 'null']
          minLength: 1
        exposures:
          type: array
          items:
            $ref: '#/components/schemas/ExposureRead'
        metadata:
          anyOf:
            - type: object
              additionalProperties:
                oneOf:
                  - type: string
                  - type: integer
                  - type: number
                  - type: boolean
            - type: 'null'
        coverage:
          items:
            $ref: '#/components/schemas/CoverageUnitPayload'
          type: array
          title: Coverage
        targeted_coverage:
          type: array
          items:
            $ref: '#/components/schemas/TargetedToolCoverage'
          description: Per-tool targeted-check outcomes, decoded from the agent's
            `metadata.targeted_coverage` summary. Empty when the scan ran no
            targeted checks.
        status:
          $ref: '#/components/schemas/ScanStatus'
        evidence_completeness:
          $ref: '#/components/schemas/EvidenceCompleteness'
        command_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        error_code:
          anyOf:
            - $ref: '#/components/schemas/ScanErrorCode'
            - type: 'null'
        host_count:
          type: integer
          minimum: 0
        finding_count:
          type: integer
          minimum: 0
        agent_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        box_name:
          anyOf:
            - type: string
            - type: 'null'
        duration:
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
        terminated_by:
          anyOf:
            - $ref: '#/components/schemas/TerminatedBy'
            - type: 'null'
        finding_evidence_policy_version:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 1
          - type: 'null'
          title: Finding Evidence Policy Version
        finding_observations:
          items:
            $ref: '#/components/schemas/FindingEvidenceObservationPayload'
          type: array
          maxItems: 512
          title: Finding Observations
        finding_observations_truncated:
          type: boolean
          title: Finding Observations Truncated
          default: false
        evidence_summary:
          anyOf:
          - $ref: '#/components/schemas/FindingEvidenceSummary'
          - type: 'null'
