            - type: 'null'
        open_ports:
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
        filtered_ports:
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
        industrial_services:
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
