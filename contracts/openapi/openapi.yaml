  schemas:
    ScanStatus:
      type: string
      enum:
        - pending
        - accepted
        - processing
        - completed
        - failed
        - cancelled
    TerminatedBy:
      type: string
      enum:
        - completed
        - user_cancel
        - timeout
        - error
    EvidenceCompleteness:
      type: string
      enum:
        - complete
        - partial
        - unknown
      description: Whether the scan's evidence covers every check. `partial` when
        the Pi reported `partial_result` or any coverage unit did not complete;
        `complete` when it reported no partial result and coverage has no gap;
        otherwise `unknown`.
    ScanMode:
      type: string
      enum:
        - quick
        - standard
        - extensive
        - nspi
        - max
    NspiSubmode:
      type: string
      enum:
        - inventory
        - read_only_mapping
        - active_validation
    NspiOptions:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          const: 1
          default: 1
        submode:
          $ref: '#/components/schemas/NspiSubmode'
          default: inventory
        active_risk_acknowledged:
          type: boolean
          default: false
        change_ticket:
          type: [string, 'null']
          minLength: 1
          maxLength: 120
    CommandStatus:
      type: string
      enum:
        - queued
        - delivered
        - running
        - uploading
        - done
        - failed
        - cancelled
        - expired
    ScanErrorCode:
      type: string
      enum:
        - device_offline
        - device_busy
        - agent_disconnected
        - scan_failed
        - scan_timeout
        - invalid_command
        - result_unavailable
        - ingest_failed
        - unknown
    Severity:
      type: string
      enum:
        - low
        - medium
        - high
        - critical
    MachineType:
      type: string
      enum:
        - router
        - computer
        - camera
        - storage
        - tv
        - phone
        - printer
        - sensor
        - unknown
    AssessmentStatus:
      type: string
      enum: [available, unavailable]
    AssessmentConfidence:
      type: string
      enum: [unknown, low, medium, high]
    EvidenceKind:
      type: string
      enum:
        - manufacturer
        - hostname
        - operating_system
        - service
        - version
        - banner
        - certificate
        - protocol
        - port
        - cpe
        - industrial
        - web_path
    ExposureRole:
      type: string
      enum:
        - administration
        - data_store
        - file_sharing
        - remote_access
        - proxy
        - api
        - device_control
        - discovery
        - media
        - general_service
        - unknown
    ExposureAttention:
      type: string
      enum: [informational, review, priority]
    ExposureConfidence:
      type: string
      enum: [low, medium, high]
    AssessmentEvidencePayload:
      type: object
      additionalProperties: false
      required: [kind, source, value]
      properties:
        kind:
          $ref: '#/components/schemas/EvidenceKind'
        source:
          type: string
          minLength: 1
          maxLength: 80
        value:
          type: string
          minLength: 1
          maxLength: 160
    DeviceProfilePayload:
      type: object
      additionalProperties: false
      required: [confidence]
      properties:
        manufacturer:
          type: [string, 'null']
          minLength: 1
          maxLength: 160
        product_family:
          type: [string, 'null']
          minLength: 1
          maxLength: 160
        model:
          type: [string, 'null']
          minLength: 1
          maxLength: 160
        confidence:
          $ref: '#/components/schemas/AssessmentConfidence'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentEvidencePayload'
