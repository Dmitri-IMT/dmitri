          type: integer
          minimum: 1
          maximum: 65535
    FindingRecord:
      type: object
      additionalProperties: false
      required:
        - finding_id
        - scan_id
        - severity
        - title
        - description
        - recommendation
        - evidence
        - detected_at
      properties:
        risk_score:
          type: [number, 'null']
          minimum: 0
          maximum: 100
        exploitability:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        confidence:
          type: [string, 'null']
          enum: [tentative, probable, confirmed, null]
        risk_rationale:
          type: [string, 'null']
        finding_id:
          type: string
          format: uuid
        scan_id:
          type: string
          format: uuid
        host_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        host_ip:
          anyOf:
            - type: string
              format: ipv4
            - type: 'null'
        port:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 65535
            - type: 'null'
        protocol:
          anyOf:
            - type: string
              enum:
                - tcp
                - udp
            - type: 'null'
        service:
          anyOf:
            - type: string
            - type: 'null'
        source:
          anyOf:
            - type: string
            - type: 'null'
        source_script:
          anyOf:
            - type: string
            - type: 'null'
        cve_id:
          anyOf:
            - type: string
              pattern: ^CVE-[0-9]{4}-[0-9]{4,}$
            - type: 'null'
        cvss_score:
          anyOf:
            - type: number
              minimum: 0
              maximum: 10
            - type: 'null'
        severity:
          $ref: '#/components/schemas/Severity'
        title:
          type: string
          minLength: 3
        description:
          type: string
          minLength: 3
        recommendation:
          type: string
          minLength: 3
        evidence:
          type: string
          minLength: 3
        references:
          type: array
          items:
            type: string
            minLength: 1
          default: []
        modbus_unit:
          anyOf:
            - $ref: '#/components/schemas/FindingModbusUnitRef'
            - type: 'null'
        detected_at:
          type: string
          format: date-time
        host_hostname:
          anyOf:
            - type: string
            - type: 'null'
        first_seen_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        last_seen_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        fixed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
