openapi: 3.1.0
info:
  title: Vulnerability Scanner Backend API
  version: 1.0.0
  summary: Contract-first OpenAPI specification for the backend consumed by the 
    agent and frontend.
  description: |
    This specification defines the backend API before implementation.
    It is the integration contract between the embedded scanning agent, the backend,
    and the frontend application.

    Security v1 documented in this spec:
    - Base path is `/api/v1`
    - Agent ingestion uses Ed25519-signed requests (ADR-005, amended 2026-07-24), not a simple API key or HMAC
    - Required signature headers are `X-Device-Id`, `X-Timestamp`, `X-Nonce`, `X-Body-SHA256`, and `X-Signature`
    - Frontend business endpoints use JWT Bearer tokens
    - Refresh cookies on `/api/v1/auth/*` only; business endpoints use Bearer JWT
    - Pi command channel: outbound WSS `/api/v1/agents/{agent_id}/commands` (see ADR-011)
    - Production uses HTTPS; local development may use HTTP
    - Browser CORS is restricted to `http://localhost:5173` and `https://app.vscanner.example.com`
tags:
  - name: scans
    description: Scan ingestion and scan history endpoints.
  - name: hosts
    description: Discovered machine inventory (network hosts found by scans).
  - name: agents
    description: Scanner Pi appliances (command channel, online state).
  - name: commands
    description: Scan-now command lifecycle.
  - name: auth
    description: Login, refresh, logout, password, and invite acceptance.
  - name: users
    description: User profiles and organisation member administration.
  - name: findings
    description: Finding query endpoints for the frontend.
  - name: home
    description: Home snapshot - attention, derived events, and the activity log.
  - name: ai
    description: Contextual AI assistant shared by frontend surfaces.
  - name: health
    description: Liveness and readiness endpoint.
servers:
  - url: https://api.vscanner.example.com
    description: Production - HTTPS required
  - url: http://localhost:8000
    description: Local development only - HTTP allowed
x-cors:
  allowedOrigins:
    - http://localhost:5173
    - https://app.vscanner.example.com
  allowCredentials: true
  allowHeaders:
    - Authorization
    - Content-Type
    - X-Request-Id
  allowMethods:
    - GET
    - POST
    - OPTIONS
  exposeHeaders:
    - X-Request-Id
security: []
paths:
  /api/v1/health:
    get:
      tags:
        - health
      summary: Health endpoint
      operationId: getHealth
      security: []
      responses:
        '200':
          description: API is available.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  value:
                    status: ok
                    version: 0.1.0
        '503':
          $ref: '#/components/responses/DatabaseUnavailableError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - health
      summary: CORS preflight for health endpoint
      operationId: optionsHealth
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/scans:
    post:
      tags:
        - scans
      summary: Ingest a full scan payload
      description: Hardware agents submit completed scan results through this
        endpoint. Security v1 requires Ed25519-signed requests with the headers
        `X-Device-Id`, `X-Timestamp`, `X-Nonce`, `X-Body-SHA256`, and
        `X-Signature`. The server verifies the signature with the device's stored
        public key, rejects replay attempts, and returns 401 for invalid or
        expired signatures and 403 for revoked devices.
      operationId: ingestScan
      security:
        - AgentSignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanIngestRequest'
            examples:
              fullScan:
                $ref: '#/components/examples/ScanIngestRequestExample'
      responses:
        '202':
          description: Scan accepted for validation and persistence.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanIngestAcceptedResponse'
              examples:
                accepted:
                  value:
                    message: scan received successfully
                    scan_id: b9a2de1d-6cb0-4d1c-9f19-8f313cfa9c77
                    hosts_received: 2
                    status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Missing signature, invalid signature, or 
            replay/clock-window failure.
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Device exists but is revoked or not allowed to submit 
            scans.
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/NonceHeader'
        - $ref: '#/components/parameters/BodySha256Header'
        - $ref: '#/components/parameters/SignatureHeader'
    get:
      tags:
        - scans
      summary: List scans
      description: 'Paginated scan listing for frontend reporting views. Authenticated
        frontend requests use `Authorization: Bearer <token>` in v1.'
      operationId: listScans
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/ScanStatusFilter'
        - $ref: '#/components/parameters/ScanAgentIdFilter'
        - $ref: '#/components/parameters/ScanSortBy'
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: Paginated scan list.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - scans
      summary: Delete every finished scan in the caller's organisation
      description: |
        Admin only. Permanently deletes every finished scan and the data that belongs only to it.
        Unfinished scans are skipped and counted in `skipped`. Machines that no remaining scan
        observed are deleted too and counted in `machines_removed`. Writes one activity entry.
      operationId: deleteAllScans
      security:
        - FrontendBearerAuth: []
      responses:
        '200':
          description: Scans deleted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanDeletionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - scans
      summary: CORS preflight for scans collection
      operationId: optionsScans
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/scans/{scan_id}:
    get:
      tags:
        - scans
      summary: Get scan details
      description: |
        Returns scan detail including hosts and findings. Before ingest completes, returns **200 stub**
        with `status: pending` and empty `hosts` / `findings` arrays (scan row created at command enqueue).
        Authenticated frontend requests use `Authorization: Bearer <token>`.
      operationId: getScanById
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '200':
          description: Full scan detail.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanDetailResponse'
              examples:
                pendingStub:
                  summary: Stub before ingest
                  value:
                    scan_id: b9a2de1d-6cb0-4d1c-9f19-8f313cfa9c77
                    timestamp: '2026-06-27T12:00:00Z'
                    subnet: 10.0.0.0/24
                    scan_mode: nspi
                    status: pending
                    command_id: c1a2b3c4-d5e6-7890-abcd-ef1234567890
                    hosts: []
                    findings: []
                    host_count: 0
                    finding_count: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - scans
      summary: Delete one finished scan
      description: |
        Admin only. Permanently deletes the scan and the data that belongs only to it. Machines
        that no remaining scan observed are deleted too. A later upload with the same `scan_id`
        is refused. Writes one activity entry.
      operationId: deleteScan
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '204':
          description: Scan deleted. The body is empty.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Unknown and foreign-organisation scans are reported identically.
        '409':
          $ref: '#/components/responses/ScanRunningConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - scans
      summary: CORS preflight for scan detail
      operationId: optionsScanById
      security: []
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/scans/{scan_id}/risk-summary:
    get:
      tags:
        - scans
      summary: Get a bounded risk summary for a scan
      description: |
        Returns aggregate risk metrics and at most ten top-ranked findings with
        their evidence. This read-only response is suitable for dashboards and
        for a future evidence-grounded LLM tool.
      operationId: getScanRiskSummary
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '200':
          description: Risk summary scoped to the caller's organisation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanRiskSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - scans
      summary: CORS preflight for scan risk summary
      operationId: optionsScanRiskSummary
      security: []
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/scans/{scan_id}/analysis:
    get:
      tags:
        - scans
      summary: Get the persisted AI interpretation of a scan
      description: |
        Returns the current analysis state. The `status` field selects the
        response variant; only `completed` carries the structured `analysis`
        payload. This read-only endpoint never invokes an AI provider. Unknown
        scans and scans owned by another organisation are both returned as not
        found. AI disabled or missing provider credentials is reported as
        unavailable.
      operationId: getScanAIAnalysis
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScanId'
        - name: language
          in: query
          required: false
          description: Language used to generate and retrieve this persisted analysis.
          schema:
            type: string
            enum: [en, pt-BR, ru]
            default: en
      responses:
        '200':
          description: AI analysis state scoped to the caller's organisation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanAIAnalysisResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - scans
      summary: Request an AI interpretation of a completed scan
      description: |
        Creates one analysis job for a completed scan. A failed job may be
        requested again. AI disabled or missing provider credentials, and scans
        that are not completed, are reported as unavailable without creating a
        job. Pending, processing, and completed analyses conflict with a repeat
        request.
      operationId: requestScanAIAnalysis
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScanId'
        - name: language
          in: query
          required: false
          description: Language used to generate and retrieve this persisted analysis.
          schema:
            type: string
            enum: [en, pt-BR, ru]
            default: en
      responses:
        '202':
          description: AI analysis request state scoped to the caller's organisation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanAIAnalysisResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: An analysis has already been requested for this scan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - scans
      summary: CORS preflight for scan AI analysis
      operationId: optionsScanAIAnalysis
      security: []
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/scans/{scan_id}/reports/{kind}:
    get:
      tags:
        - scans
      summary: Read a scan report
      description: Returns the explained or technical report data for a completed scan.
      operationId: getScanReport
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScanId'
        - name: kind
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ReportKind'
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum: [en, pt-BR, ru]
            default: en
      responses:
        '200':
          description: Report scoped to the caller's organisation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The scan is not ready for a report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'


  /api/v1/ai/usage:
    get:
      tags:
        - ai
      summary: Get AI provider usage
      description: Returns organization-scoped operational usage metadata without prompts or model responses.
      operationId: getAIUsage
      security:
        - FrontendBearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: AI usage summary and recent requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIUsageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/ai/chat/history:
    get:
      tags:
        - ai
      summary: List contextual AI chat history
      operationId: listContextAIChat
      security:
        - FrontendBearerAuth: []
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [scan, host, finding]
        - name: context_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Last ten questions for the selected context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIChatHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/ai/chat:
    post:
      tags:
        - ai
      summary: Ask the contextual AI assistant
      operationId: askContextAI
      security:
        - FrontendBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIContextChatRequest'
      responses:
        '200':
          description: Grounded answer for the selected context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIChatResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Context exceeds the provider limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: AI provider rate limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/scans/{scan_id}/reports/{kind}/download:
    get:
      tags:
        - scans
      summary: Download a scan report
      description: Downloads the explained report as PDF or the technical report as raw JSON.
      operationId: downloadScanReport
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScanId'
        - name: kind
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ReportKind'
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum: [en, pt-BR, ru]
            default: en
      responses:
        '200':
          description: Downloadable PDF report or raw JSON report.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The scan is not ready for a report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/hosts:
    get:
      tags:
        - hosts
      summary: List hosts
      description: >-
        Returns discovered machines from scans. The default page returns active
        machines; `group=quiet` pages the machines not seen recently. `quiet_total`
        counts the quiet machines across the whole inventory, not just this page.
        JWT Bearer required.
      operationId: listHosts
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/HostSortBy'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/HostGroup'
        - name: q
          in: query
          description: Free-text search by hostname, IP, MAC, or vendor.
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Paginated host list.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - hosts
      summary: Delete every machine in the caller's organisation
      description: |
        Admin only. Permanently deletes every machine, its findings and its rows in old scans.
        The scans stay. A machine found again by a later scan comes back as a new machine.
        Writes one activity entry.
      operationId: deleteAllHosts
      security:
        - FrontendBearerAuth: []
      responses:
        '200':
          description: Machines deleted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostDeletionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
        - hosts
      summary: CORS preflight for hosts collection
      operationId: optionsHosts
      security: []
      responses:
        '204':
          $ref: '#/components/responses/CorsPreflightNoContent'

  /api/v1/hosts/{host_id}:
    get:
      tags:
        - hosts
      summary: Get host details
      description: Returns host detail, ports, severity summary, and scan history. JWT Bearer required.
      operationId: getHostById
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/HostId'
      responses:
        '200':
          description: Host detail with scan history.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Vary:
              $ref: '#/components/headers/Vary-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - hosts
      summary: Delete one machine
      description: |
        Admin only. Permanently deletes the machine, its findings and its rows in old scans.
        The scans stay. A machine found again by a later scan comes back as a new machine.
        Writes one activity entry.
      operationId: deleteHost
      security:
        - FrontendBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/HostId'
