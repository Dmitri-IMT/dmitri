      properties:
        agent_id:
          type: string
          format: uuid

    UpdateAgentTargetSubnetRequest:
      type: object
      additionalProperties: false
      required:
        - target_subnet
      properties:
        target_subnet:
          type: string
          pattern: '^([0-9]{1,3}[.]){3}[0-9]{1,3}/[0-9]{1,2}$'
          example: 10.0.0.0/24

    AvailableSubnet:
      type: object
      additionalProperties: false
      required:
        - interface
        - cidr
        - is_default_route
      properties:
        interface:
          type: string
          minLength: 1
          example: eth0
        cidr:
          type: string
          pattern: '^([0-9]{1,3}[.]){3}[0-9]{1,3}/[0-9]{1,2}$'
          example: 10.0.0.0/24
        is_default_route:
          type: boolean
          example: false
    AgentHelloFrame:
      type: object
      additionalProperties: false
      description: |
        **Pi → backend**, sent on every connect, before any `status` frame. The Pi is dual-homed
        (ethernet on the target subnet, wifi for internet) so it sees more than one network and
        cannot guess which to scan. It reports what it sees; a human chooses `target_subnet` once.
      required:
        - type
        - agent_version
        - available_subnets
      properties:
        type:
          type: string
          const: hello
        agent_version:
          type: string
          example: 0.2.0
        available_subnets:
          type: array
          items:
            $ref: '#/components/schemas/AvailableSubnet'
        package_version:
          type:
            - string
            - 'null'
        updater_version:
          type:
            - string
            - 'null'
        os_suite:
          type:
            - string
            - 'null'
        architecture:
          type:
            - string
            - 'null'
        capabilities:
          type: array
          items:
            type: string
            enum: [scan_finalization_v1, agent_update_v1]
          default: []
        update_context:
          anyOf:
            - $ref: '#/components/schemas/AgentUpdateHelloContext'
            - type: 'null'
    AgentUpdateHelloContext:
      type: object
      additionalProperties: false
      required: [update_id, invocation_id]
      properties:
        update_id: { type: string, format: uuid }
        invocation_id: { type: string, format: uuid }
    AgentCommandFrame:
      type: object
      additionalProperties: false
      description: |
        **Backend → Pi.** Delivered on the open socket when an operator triggers "Scan now".
        Duplicate delivery of the same `command_id` must be acked without re-running the scan.
      required:
        - type
        - command_id
        - scan_id
        - scan_mode
        - subnet
      properties:
        type:
          type: string
          const: command
        command_id:
          type: string
          format: uuid
        scan_id:
          type: string
          format: uuid
          description: Assigned by the backend at enqueue. The Pi MUST reuse it in the
            ingest payload it later POSTs to /api/v1/scans.
        scan_mode:
          $ref: '#/components/schemas/ScanMode'
        subnet:
          type: string
          pattern: '^([0-9]{1,3}[.]){3}[0-9]{1,3}/[0-9]{1,2}$'
        nspi_options:
          anyOf:
            - $ref: '#/components/schemas/NspiOptions'
            - type: 'null'
    AgentStatusFrame:
      type: object
      additionalProperties: false
      description: |
        **Pi → backend.** Command lifecycle reports. Scan results are never sent on the socket — they go to
        `POST /api/v1/scans`. `queued`, `delivered` and `expired` are backend-owned and never appear
        here.
      required:
        - type
        - command_id
        - status
      properties:
        type:
          type: string
          const: status
        command_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - running
            - uploading
            - done
            - failed
            - cancelled
        error_code:
          type:
            - string
            - 'null'
    AgentProgressFrame:
      type: object
      additionalProperties: false
      description: |
        **Pi → backend.** One compact, sequenced progress snapshot for an active command. The full
        scan payload is sent separately to `POST /api/v1/scans`.
      required:
        - type
        - command_id
        - scan_id
        - sequence
        - progress
      properties:
        type:
          type: string
          const: progress
        command_id:
          type: string
          format: uuid
        scan_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        progress:
          $ref: '#/components/schemas/ScanProgressSnapshot'
    ScanProgressSnapshot:
      type: object
      additionalProperties: false
      required:
        - stage
        - percent
        - machines
        - open_ports
        - filtered_ports
        - industrial_services
        - vulnerabilities
      properties:
        stage:
          type: string
          enum:
