          type: boolean
          example: false
    AgentHelloFrame:
      type: object
      additionalProperties: false
      description: |
        **Pi → backend**, sent on every connect, before any `status` frame. The Pi is dual-homed
        (ethernet on the target subnet, wifi for internet) so it sees more than one network and
        cannot guess which to scan. It reports what it sees; a human chooses `target_subnet` once.
      required:
        - type
        - agent_version
        - available_subnets
      properties:
        type:
          type: string
          const: hello
        agent_version:
          type: string
          example: 0.2.0
        available_subnets:
          type: array
          items:
            $ref: '#/components/schemas/AvailableSubnet'
    AgentCommandFrame:
      type: object
      additionalProperties: false
      description: |
        **Backend → Pi.** Delivered on the open socket when an operator triggers "Scan now".
        Duplicate delivery of the same `command_id` must be acked without re-running the scan.
      required:
        - type
        - command_id
        - scan_id
        - scan_mode
        - subnet
      properties:
        type:
          type: string
          const: command
        command_id:
          type: string
          format: uuid
        scan_id:
          type: string
          format: uuid
          description: Assigned by the backend at enqueue. The Pi MUST reuse it in the
            ingest payload it later POSTs to /api/v1/scans.
        scan_mode:
          $ref: '#/components/schemas/ScanMode'
        subnet:
          type: string
          pattern: '^([0-9]{1,3}[.]){3}[0-9]{1,3}/[0-9]{1,2}$'
        nspi_options:
          anyOf:
            - $ref: '#/components/schemas/NspiOptions'
            - type: 'null'
    AgentStatusFrame:
      type: object
      additionalProperties: false
      description: |
        **Pi → backend.** Progress reports. Scan results are never sent on the socket — they go to
        `POST /api/v1/scans`. `queued`, `delivered` and `expired` are backend-owned and never appear
        here.
      required:
        - type
        - command_id
        - status
      properties:
        type:
          type: string
          const: status
        command_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - running
            - uploading
            - done
            - failed
        error_code:
          type:
            - string
            - 'null'
    AgentErrorFrame:
      type: object
      additionalProperties: false
      description: |
        **Backend → Pi.** Sent when an inbound frame cannot be parsed or fails validation
        (malformed JSON, missing/unknown `type`, unknown `status` value, a `command` frame from
        the Pi). The connection stays open — the Pi may keep sending frames.
      required:
        - type
        - message
      properties:
        type:
          type: string
          const: error
        message:
          type: string
          example: unknown frame type
