server_tokens on;
autoindex on;

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers 'DEFAULT:3DES:DES:@SECLEVEL=0';
    ssl_prefer_server_ciphers on;

    location = /.git/HEAD { default_type text/plain; }
    location = /.git/config { default_type text/plain; }
    location = /.env { default_type text/plain; }
    location = /config.json { default_type application/json; }
    location = /backup.zip { default_type application/octet-stream; }
    location = /database.sql { default_type text/plain; }
    location = /error.log { default_type text/plain; }
    location = /prometheus { default_type text/plain; }
    location = /actuator/env { default_type application/json; }
    location = /assets/ { autoindex on; }

    location / {
        if ($request_method = TRACE) {
            return 200 "TRACE enabled in isolated training lab\\n";
        }
        if ($request_method = OPTIONS) {
            add_header Allow "GET, HEAD, POST, OPTIONS, TRACE" always;
            return 204;
        }
    }
}
