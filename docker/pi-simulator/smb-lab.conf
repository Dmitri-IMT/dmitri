[global]
   server string = dmitri isolated targeted lab
   security = user
   map to guest = Bad User
   smb ports = 445 139
   server min protocol = NT1
   server max protocol = SMB3
   server signing = disabled
   ntlm auth = ntlmv1-permitted
   log file = /dev/stdout

[public]
   path = /srv/public
   guest ok = yes
   read only = yes
   browseable = yes
   force user = nobody
