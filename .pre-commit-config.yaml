default_stages: [push]

repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        stages: [push]
        args: ["--check", "backend", "hardware-agent"]
        pass_filenames: false
        always_run: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        stages: [push]
        args: ["check", "backend", "hardware-agent"]
        pass_filenames: false
        always_run: true

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        stages: [push]

  - repo: local
    hooks:
      - id: pytest
        name: Run pytest (backend + hardware-agent)
        entry: python -m pytest backend/tests hardware-agent/tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [push]