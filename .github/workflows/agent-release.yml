name: Agent APT release

on:
  push:
    tags:
      - "agent-v*"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-apt-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate immutable source tag and version
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
          tag_version="${GITHUB_REF_NAME#agent-v}"
          source_version=$(sed -n 's/^version = "\(.*\)"/\1/p' hardware-agent/pyproject.toml)
          [[ "$GITHUB_REF_NAME" =~ ^agent-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$tag_version" = "$source_version"
          test -f .github/workflows/agent-release.yml
          test -f hardware-agent/packaging/publish-apt.sh
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Install package build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev

      - name: Install pinned uv
        run: |
          curl --fail --location --retry 3 \
            https://github.com/astral-sh/uv/releases/download/0.11.20/uv-aarch64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/uv.tar.gz"
          echo "c8b5b7f9c804b640da0bb66cddddf0a00ce971f64d8076622d70bd141bc80857  $RUNNER_TEMP/uv.tar.gz" | sha256sum --check
          sudo tar -xzf "$RUNNER_TEMP/uv.tar.gz" --strip-components=1 -C /usr/local/bin uv-aarch64-unknown-linux-gnu/uv

      - name: Build and install both native arm64 packages
        shell: bash
        run: |
          set -euo pipefail
          chmod +x hardware-agent/packaging/build-deb.sh hardware-agent/packaging/apt-upgrade-agent
          sudo mkdir -p /opt/uv-python/bin
          sudo ln -s "$(command -v python3)" /opt/uv-python/bin/python
          hardware-agent/packaging/build-deb.sh "$RUNNER_TEMP/hardware-agent.deb" "$RUNNER_TEMP/hardware-agent-updater.deb"
          agent_package="$RUNNER_TEMP/hardware-agent.deb"
          updater_package="$RUNNER_TEMP/hardware-agent-updater.deb"
          agent_version="${{ steps.source.outputs.version }}-1"
          updater_version="$(tr -d '[:space:]' < hardware-agent/packaging/updater-version)-1"
          test "$(dpkg-deb -f "$agent_package" Package)" = hardware-agent
          test "$(dpkg-deb -f "$agent_package" Version)" = "$agent_version"
          test "$(dpkg-deb -f "$agent_package" Architecture)" = arm64
          test "$(dpkg-deb -f "$updater_package" Package)" = hardware-agent-updater
          test "$(dpkg-deb -f "$updater_package" Version)" = "$updater_version"
          test "$(dpkg-deb -f "$updater_package" Architecture)" = all
          dpkg-deb -c "$agent_package" | grep 'opt/dmitri-agent/.*\.whl'
          dpkg-deb -c "$agent_package" | grep 'lib/systemd/system/dmitri-agent.service'
          if dpkg-deb -c "$agent_package" | grep -E 'usr/lib/dmitri/(updater.py|apt-upgrade-agent|scan-lock-path)'; then
            echo 'Updater-owned files must be in hardware-agent-updater.' >&2
            exit 1
          fi
          dpkg-deb -c "$updater_package" | grep 'usr/lib/dmitri/apt-upgrade-agent'
          dpkg-deb -c "$updater_package" | grep 'usr/lib/dmitri/scan-lock-path'
          dpkg-deb -c "$updater_package" | grep 'dmitri-agent-update-check.service'
          sudo dpkg --install "$updater_package" "$agent_package"
          test -x /opt/dmitri-agent/.venv/bin/dmitri
          set +e
          /opt/dmitri-agent/.venv/bin/dmitri __dmitri_install_smoke_check__ > "$RUNNER_TEMP/install-smoke.log" 2>&1
          smoke_status=$?
          set -e
          test "$smoke_status" -eq 2
          grep -q 'Unknown command' "$RUNNER_TEMP/install-smoke.log"

      - name: Record build provenance and hashes
        shell: bash
        env:
          SOURCE_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          import uuid
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          files = {
              "hardware-agent": root / "hardware-agent.deb",
              "hardware-agent-updater": root / "hardware-agent-updater.deb",
          }
          packages = {}
          for name, path in files.items():
              packages[name] = {
                  "path": path.name,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size_bytes": path.stat().st_size,
                  "version": subprocess.check_output(
                      ["dpkg-deb", "-f", str(path), "Version"], text=True
                  ).strip(),
                  "architecture": subprocess.check_output(
                      ["dpkg-deb", "-f", str(path), "Architecture"], text=True
                  ).strip(),
              }
          manifest = {
              "source_commit": os.environ["SOURCE_COMMIT"],
              "release_id": str(uuid.uuid4()),
              "upstream_version": os.environ["SOURCE_VERSION"],
              "packages": packages,
              "tools": {
                  "architecture": platform.machine(),
                  "python": platform.python_version(),
                  "uv": subprocess.check_output(["uv", "--version"], text=True).strip(),
                  "dpkg_deb": subprocess.check_output(["dpkg-deb", "--version"], text=True).splitlines()[0],
              },
              "tests": "native arm64 build, package identity/ownership checks, dpkg install, offline postinst and final CLI smoke passed",
          }
          (root / "release-manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hardware-agent.deb
            ${{ runner.temp }}/hardware-agent-updater.deb
            ${{ runner.temp }}/release-manifest.json
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    if: >-
      always() &&
      (github.ref_type == 'tag' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: agent-release-signing
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.prepare.outputs.should_publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: github.ref_type == 'tag'
        with:
          name: agent-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packages

      - name: Verify approved key and import signing-only subkey
        shell: bash
        env:
          GNUPGHOME: ${{ runner.temp }}/agent-signing-home
          SUBKEY_ASC: ${{ secrets.AGENT_APT_SIGNING_SUBKEY }}
          PASSPHRASE: ${{ secrets.AGENT_APT_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          keyring="$GITHUB_WORKSPACE/backend/agent-release/public-keyring.gpg"
          test -f "$keyring"
          primary_fingerprint=92BD91D03608EA3AFDB108AAB7EEC4E4E954DA7A
          signing_fingerprint=49B97982F566B0FEF9F2412FDC0B27B955B74936
          gpg --show-keys --with-colons "$keyring" | grep -q "^fpr:::::::::$primary_fingerprint:$"
          gpg --show-keys --with-colons "$keyring" | grep -q "^fpr:::::::::$signing_fingerprint:$"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s\n' "$SUBKEY_ASC" | gpg --batch --import
          printf '%s' "$PASSPHRASE" > "$RUNNER_TEMP/signing-passphrase"
          chmod 0600 "$RUNNER_TEMP/signing-passphrase"
          gpg --with-colons --list-secret-keys "$primary_fingerprint" | python -c '
          import sys
          records = [line.rstrip("\n").split(":") for line in sys.stdin]
          primary_missing = any(row[0] == "sec" and len(row) > 14 and row[14] == "#" for row in records)
          signing_subkey_available = any(row[0] == "ssb" and len(row) > 14 and row[14] == "+" for row in records)
          if not primary_missing or not signing_subkey_available:
              raise SystemExit("CI must contain only the approved signing subkey, without primary secret material")
          '

      - name: Restore retained APT state and prepare signed candidate
        id: prepare
        shell: bash
        env:
          GNUPGHOME: ${{ runner.temp }}/agent-signing-home
          PRIMARY_FINGERPRINT: 92BD91D03608EA3AFDB108AAB7EEC4E4E954DA7A
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/agent-apt-state"
          mkdir -m 0700 "$state"
          git -C "$state" init -q
          git -C "$state" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          base_sha=none
          remote_refs="$RUNNER_TEMP/state-refs.txt"
          git ls-remote origin refs/heads/agent-apt-state > "$remote_refs"
          if [[ -s "$remote_refs" ]]; then
            git -C "$state" fetch --depth=1 origin refs/heads/agent-apt-state:refs/remotes/origin/agent-apt-state
            base_sha=$(git -C "$state" rev-parse refs/remotes/origin/agent-apt-state)
            git -C "$state" checkout --detach -q "$base_sha"
            sh hardware-agent/packaging/publish-apt.sh verify-current \
              --repo "$state" --suite stable --keyring backend/agent-release/public-keyring.gpg
          elif [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo 'should_publish=false' >> "$GITHUB_OUTPUT"
            echo 'No retained state exists yet; scheduled metadata refresh is a no-op.'
            exit 0
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            manifest="$RUNNER_TEMP/packages/release-manifest.json"
            agent_package="$RUNNER_TEMP/packages/hardware-agent.deb"
            updater_package="$RUNNER_TEMP/packages/hardware-agent-updater.deb"
            test -s "$manifest" && test -s "$agent_package" && test -s "$updater_package"
            python - "$manifest" "$agent_package" "$updater_package" <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          manifest_path = Path(sys.argv[1])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          for name, path_text in zip(("hardware-agent", "hardware-agent-updater"), sys.argv[2:]):
              path = Path(path_text)
              entry = manifest["packages"][name]
              assert path.name == entry["path"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == entry["sha256"]
              assert path.stat().st_size == entry["size_bytes"]
              assert subprocess.check_output(["dpkg-deb", "-f", str(path), "Package"], text=True).strip() == name
          assert manifest["tools"]["architecture"] == "aarch64"
          PY
            release_id=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["release_id"])' "$manifest")
            source_commit=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_commit"])' "$manifest")
            upstream_version=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["upstream_version"])' "$manifest")
            updater_version=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["packages"]["hardware-agent-updater"]["version"])' "$manifest")
            candidate=$(sh hardware-agent/packaging/publish-apt.sh prepare \
              --repo "$state" --package "$agent_package" --updater-package "$updater_package" \
              --updater-version "$updater_version" --updater-source-commit "$source_commit" \
              --release-id "$release_id" --source-commit "$source_commit" \
              --upstream-version "$upstream_version" --architecture arm64 --suite stable \
              --origin Dmitri --release-notes "Dmitri agent $upstream_version")
          else
            candidate=$(sh hardware-agent/packaging/publish-apt.sh prepare --repo "$state" --suite stable --origin Dmitri)
          fi
          sh hardware-agent/packaging/publish-apt.sh sign --repo "$state" \
            --candidate "$candidate" --suite stable --gnupg-home "$GNUPGHOME" \
            --key-id "$PRIMARY_FINGERPRINT" --passphrase-file "$RUNNER_TEMP/signing-passphrase"
          tar -czf "$RUNNER_TEMP/signed-state.tar.gz" -C "$state" .staging pool snapshots dists
          printf '{"base_sha":"%s","candidate":"%s"}\n' "$base_sha" "$candidate" > "$RUNNER_TEMP/publish-manifest.json"
          echo 'should_publish=true' >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.prepare.outputs.should_publish == 'true'
        with:
          name: signed-agent-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/signed-state.tar.gz
            ${{ runner.temp }}/publish-manifest.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: sign
    if: needs.sign.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: agent-release-publishing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-agent-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-state

      - name: Verify the state base, signature, and candidate before promotion
        id: promote
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/agent-apt-state"
          mkdir -m 0700 "$state"
          git -C "$state" init -q
          git -C "$state" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          base_sha=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["base_sha"])' "$RUNNER_TEMP/signed-state/publish-manifest.json")
          candidate=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["candidate"])' "$RUNNER_TEMP/signed-state/publish-manifest.json")
          remote_sha=$(git ls-remote origin refs/heads/agent-apt-state | cut -f1)
          if [[ "$base_sha" == none ]]; then
            test -z "$remote_sha" || { echo 'stale candidate: state branch was created after signing' >&2; exit 1; }
          else
            test "$remote_sha" = "$base_sha" || { echo 'stale candidate: authoritative state advanced after signing' >&2; exit 1; }
            git -C "$state" fetch --depth=1 origin refs/heads/agent-apt-state:refs/remotes/origin/agent-apt-state
            git -C "$state" checkout -B agent-apt-state refs/remotes/origin/agent-apt-state
          fi
          tar -tzf "$RUNNER_TEMP/signed-state/signed-state.tar.gz" | grep -q '^\.staging/'
          python - "$state" <<'PY'
          import shutil
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve(strict=True)
          for name in (".staging", "pool", "snapshots", "dists"):
              target = root / name
              if target.is_symlink():
                  target.unlink()
              elif target.exists():
                  target.resolve(strict=True).relative_to(root)
                  shutil.rmtree(target)
          PY
          tar -xzf "$RUNNER_TEMP/signed-state/signed-state.tar.gz" -C "$state"
          sh hardware-agent/packaging/publish-apt.sh promote --repo "$state" \
            --candidate "$candidate" --suite stable --keyring backend/agent-release/public-keyring.gpg
          rm -rf "$state/.staging"
          if [[ -z "$base_sha" || "$base_sha" == none ]]; then
            git -C "$state" branch -M agent-apt-state
          fi
          git -C "$state" config user.name 'github-actions[bot]'
          git -C "$state" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$state" add -- pool snapshots dists
          git -C "$state" diff --cached --quiet && { echo 'promotion produced no state changes' >&2; exit 1; }
          git -C "$state" commit -m "Publish signed agent APT generation"
          git -C "$state" remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -C "$state" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:refs/heads/agent-apt-state
          published_sha=$(git ls-remote origin refs/heads/agent-apt-state | cut -f1)
          test "$published_sha" = "$(git -C "$state" rev-parse HEAD)"
          python hardware-agent/packaging/prepare-pages.py --repo "$state" \
            --output "$RUNNER_TEMP/pages" --keyring backend/agent-release/public-keyring.gpg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages
          if-no-files-found: error
          retention-days: 7

  pages:
    needs: publish
    if: success()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/pages

      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
