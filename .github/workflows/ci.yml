name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Compile Python sources
        run: |
          python -m compileall hardware-agent/src
      - name: Validate JSON Schemas
        run: |
          python - <<'PY'
          import json
          import pathlib

          schema_dir = pathlib.Path('contracts/schemas')
          for path in schema_dir.glob('*.json'):
              json.loads(path.read_text())
              print(f"Loaded {path}")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          pip install ruff black

      - name: Run Ruff
        run: ruff check hardware-agent

      - name: Run Black
        run: black --check hardware-agent

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install hardware-agent with test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "hardware-agent[dev]"

      - name: Run pytest
        run: python -m pytest hardware-agent/tests

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dmitri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL_TEST: postgresql+psycopg://postgres:postgres@localhost:5432/dmitri_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Run backend test suite
        working-directory: backend
        run: |
          uv run pytest -ra | tee pytest-output.log
          if grep -qE '[0-9]+ skipped' pytest-output.log; then
            echo "::error::Database-test skips detected; CI requires a zero-skip backend suite."
            exit 1
          fi

      - name: Run Ruff
        working-directory: backend
        run: uv run ruff check .
