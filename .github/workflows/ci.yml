name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Compile Python sources
        run: |
          python -m compileall hardware-agent/src
      - name: Validate JSON Schemas
        run: |
          python - <<'PY'
          import json
          import pathlib

          schema_dir = pathlib.Path('contracts/schemas')
          for path in schema_dir.glob('*.json'):
              json.loads(path.read_text())
              print(f"Loaded {path}")
          PY

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Mirrors the pre-push hook in .pre-commit-config.yaml, which only runs for
      # contributors who have installed it locally.
      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      # Deliberately not `detect-secrets-hook`: that rewrites the baseline's line
      # numbers whenever content shifts and then exits 1, which CI cannot resolve
      # by staging the result. Compare secret identities instead, so the job fails
      # only on a secret that is genuinely absent from the committed baseline.
      #
      # Identity is the secret's (type, value), NOT its file path: the shared test
      # password is baselined under nine paths already, so path-keying failed every
      # new test file that used it and forced a baseline commit per PR.
      - name: Scan for secrets missing from the baseline
        run: |
          detect-secrets scan --baseline .secrets.baseline
          python - <<'PY'
          import json, subprocess, sys

          def identities(baseline):
              return {
                  (entry["type"], entry["hashed_secret"])
                  for entries in baseline["results"].values()
                  for entry in entries
              }

          committed = json.loads(
              subprocess.run(
                  ["git", "show", "HEAD:.secrets.baseline"],
                  capture_output=True, text=True, check=True,
              ).stdout
          )
          with open(".secrets.baseline") as handle:
              scanned = json.load(handle)
          found = identities(scanned)

          new = found - identities(committed)
          if new:
              print("Secret values not present in .secrets.baseline:")
              for path, entries in sorted(scanned["results"].items()):
                  for entry in entries:
                      if (entry["type"], entry["hashed_secret"]) in new:
                          print(f'  {path}:{entry["line_number"]}: {entry["type"]}')
              print("\nIf these are false positives, run:")
              print("  detect-secrets scan --baseline .secrets.baseline")
              print("and commit the regenerated baseline.")
              sys.exit(1)
          print(f"No new secret values ({len(found)} baselined).")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          pip install ruff black

      - name: Run Ruff
        run: ruff check hardware-agent

      - name: Run Black
        run: black --check hardware-agent

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install hardware-agent with test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "hardware-agent[dev]"

      - name: Run pytest
        run: python -m pytest hardware-agent/tests

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dmitri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL_TEST: postgresql+psycopg://postgres:postgres@localhost:5432/dmitri_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Run backend test suite
        working-directory: backend
        run: |
          uv run pytest -ra | tee pytest-output.log
          if grep -qE '[0-9]+ skipped' pytest-output.log; then
            echo "::error::Database-test skips detected; CI requires a zero-skip backend suite."
            exit 1
          fi

      - name: Run Ruff
        working-directory: backend
        run: uv run ruff check .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate OpenAPI types
        working-directory: frontend
        run: npm run gen:types

      - name: Check for contract drift
        working-directory: frontend
        run: git diff --exit-code -- src/types

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Run typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run tests
        working-directory: frontend
        run: npm run test

      - name: Build
        env:
          VITE_API_URL: http://localhost:8000
        working-directory: frontend
        run: npm run build

  # Railway auto-deploys `main`, but nothing in the deploy applies Alembic
  # migrations: `dmitri_runtime` holds no DDL privilege, and `DATABASE_URL_DIRECT`
  # is deliberately absent from both services (docs/cloud/railway/SETUP.md, risk 7).
  # Applying a migration is a human step, and skipping it ships code whose model
  # does not match the live schema — every query against the changed table then
  # 500s until someone reads the logs, which is exactly how 20260912_26 went
  # unapplied for four days.
  #
  # So this job asks the hosted database what revision it is actually at, rather
  # than trusting a label or a checklist. It reads one string from
  # alembic_version with the restricted pooled runtime credential; that read is
  # the only privilege it needs, granted by 20260917_27.
  #
  # The credential means no code from the pull request may run here. Two
  # checkouts keep that true: the checker comes from the base branch, which is
  # already reviewed, and the pull request supplies only its migration files,
  # which the checker parses with `ast` instead of importing. (Alembic's own
  # ScriptDirectory imports migration files, so it cannot be used on them.)
  # A GitHub Environment with required reviewers would be the usual answer, but
  # deployment protection rules need GitHub Team and this org is on the free plan.
  schema:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base branch (trusted — runs the checker)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Check out the pull request (untrusted — supplies migrations only)
        uses: actions/checkout@v4
        with:
          path: pr

      # Pinned to a commit, unlike the `backend` job above, because this job
      # holds a database credential: a moved `v5` tag could swap the `uv` binary
      # that later runs with DATABASE_URL in its environment. (v5 == d4b2f3b.)
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Install backend dependencies from the base branch
        working-directory: base/backend
        run: uv sync --frozen

      # A missing secret must fail, never pass quietly: a gate that green-lights
      # itself when it cannot see the database is worse than no gate. Fork pull
      # requests get no secrets and so cannot satisfy this check by design.
      - name: Check the hosted database is not behind this branch
        working-directory: base/backend
        env:
          DATABASE_URL: ${{ secrets.HOSTED_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::HOSTED_DATABASE_URL is not set; this check cannot verify the hosted schema."
            exit 1
          fi
          uv run backend-check-hosted-revision \
            --versions ../../pr/backend/alembic/versions
