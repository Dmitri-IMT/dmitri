name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Compile Python sources
        run: |
          python -m compileall hardware-agent/src
      - name: Validate JSON Schemas
        run: |
          python - <<'PY'
          import json
          import pathlib

          schema_dir = pathlib.Path('contracts/schemas')
          for path in schema_dir.glob('*.json'):
              json.loads(path.read_text())
              print(f"Loaded {path}")
          PY

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Mirrors the pre-push hook in .pre-commit-config.yaml, which only runs for
      # contributors who have installed it locally.
      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      # Deliberately not `detect-secrets-hook`: that rewrites the baseline's line
      # numbers whenever content shifts and then exits 1, which CI cannot resolve
      # by staging the result. Compare secret identities instead, so the job fails
      # only on a secret that is genuinely absent from the committed baseline.
      #
      # Identity is the secret's (type, value), NOT its file path: the shared test
      # password is baselined under nine paths already, so path-keying failed every
      # new test file that used it and forced a baseline commit per PR.
      - name: Scan for secrets missing from the baseline
        run: |
          detect-secrets scan --baseline .secrets.baseline
          python - <<'PY'
          import json, subprocess, sys

          def identities(baseline):
              return {
                  (entry["type"], entry["hashed_secret"])
                  for entries in baseline["results"].values()
                  for entry in entries
              }

          committed = json.loads(
              subprocess.run(
                  ["git", "show", "HEAD:.secrets.baseline"],
                  capture_output=True, text=True, check=True,
              ).stdout
          )
          with open(".secrets.baseline") as handle:
              scanned = json.load(handle)
          found = identities(scanned)

          new = found - identities(committed)
          if new:
              print("Secret values not present in .secrets.baseline:")
              for path, entries in sorted(scanned["results"].items()):
                  for entry in entries:
                      if (entry["type"], entry["hashed_secret"]) in new:
                          print(f'  {path}:{entry["line_number"]}: {entry["type"]}')
              print("\nIf these are false positives, run:")
              print("  detect-secrets scan --baseline .secrets.baseline")
              print("and commit the regenerated baseline.")
              sys.exit(1)
          print(f"No new secret values ({len(found)} baselined).")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          pip install ruff black

      - name: Run Ruff
        run: ruff check hardware-agent

      - name: Run Black
        run: black --check hardware-agent

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install hardware-agent with test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "hardware-agent[dev]"

      - name: Run pytest
        run: python -m pytest hardware-agent/tests

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dmitri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL_TEST: postgresql+psycopg://postgres:postgres@localhost:5432/dmitri_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Run backend test suite
        working-directory: backend
        run: |
          uv run pytest -ra | tee pytest-output.log
          if grep -qE '[0-9]+ skipped' pytest-output.log; then
            echo "::error::Database-test skips detected; CI requires a zero-skip backend suite."
            exit 1
          fi

      - name: Run Ruff
        working-directory: backend
        run: uv run ruff check .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate OpenAPI types
        working-directory: frontend
        run: npm run gen:types

      - name: Check for contract drift
        working-directory: frontend
        run: git diff --exit-code -- src/types

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Run typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run tests
        working-directory: frontend
        run: npm run test

      - name: Build
        env:
          VITE_API_URL: http://localhost:8000
        working-directory: frontend
        run: npm run build

  agent-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require a hardware-agent version bump
        run: python hardware-agent/scripts/check_agent_version.py origin/main

  agent-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the hardware-agent deb
        run: |
          chmod +x hardware-agent/packaging/build-deb.sh hardware-agent/packaging/apt-upgrade-agent
          hardware-agent/packaging/build-deb.sh /tmp/hardware-agent.deb
          expected=$(sed -n 's/^version = "\(.*\)"/\1/p' hardware-agent/pyproject.toml)
          test "$(dpkg-deb -f /tmp/hardware-agent.deb Version)" = "$expected"
          dpkg-deb -c /tmp/hardware-agent.deb | grep 'usr/lib/dmitri/apt-upgrade-agent'
          dpkg-deb -c /tmp/hardware-agent.deb | grep 'lib/systemd/system/dmitri-agent.service'

