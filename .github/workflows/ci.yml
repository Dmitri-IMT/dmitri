name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn pydantic requests
      - name: Compile Python sources
        run: |
          python -m compileall hardware-agent/src backend/src
      - name: Validate JSON Schemas
        run: |
          python - <<'PY'
          import json
          import pathlib

          schema_dir = pathlib.Path('contracts/schemas')
          for path in schema_dir.glob('*.json'):
              json.loads(path.read_text())
              print(f"Loaded {path}")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          pip install ruff black

      - name: Run Ruff
        run: ruff check backend hardware-agent

      - name: Run Black
        run: black --check backend hardware-agent

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Run ESLint
        run: npm run lint
        