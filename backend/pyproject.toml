[project]
name = "backend-api"
version = "0.1.0"
description = "FastAPI backend for the vulnerability scanner device (skeleton)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.23.2",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.1",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.1.12",
  "sqlmodel>=0.0.21",
  "sqlalchemy>=2.0.29",
  "httpx>=0.27.0"
]

[project.scripts]
backend-smoke-test = "api.smoke_test:main"
backend-worker = "api.worker_main:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
