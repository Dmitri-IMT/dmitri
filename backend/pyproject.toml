[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backend-api"
version = "0.1.0"
description = "FastAPI backend for the vulnerability scanner device (skeleton)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.110.0",
  "uvicorn>=0.23.2",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.1",
  "psycopg[binary]>=3.1.12",
  "sqlmodel>=0.0.21",
  "sqlalchemy>=2.0.29",
  "httpx>=0.27.0",
  "pyjwt>=2.8.0",
  "argon2-cffi>=23.1.0",
  "cryptography>=42.0",
  "websockets>=13"
]

[project.scripts]
backend-worker = "api.worker_main:main"
backend-bootstrap-org = "api.management.bootstrap_org:main"
backend-provision-agent = "api.management.provision_agent:main"
backend-check-hosted-revision = "api.management.check_hosted_revision:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyyaml"]

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
